/* ---------- loop ---------- */
const o={x:0,y:0,z:0,a:1,e:false};

  const now=ms/1000; let dt=Math.min(.05,Math.max(0,now-last)); last=now; if(reduce) dt*=.4;

      }
    }
    if(p.amt>0) p.amt=Math.max(0,p.amt-dt*((cur===LAST||play)?.03:.045));

    const B=o.wh?TH.wh:o.e?G:I, bh=B[0], bs=B[1], bl=B[2]; let h=bh,s=bs,l=bl;
    if(p.amt>.002){const a=p.amt; h=lerpHue(bh,p.h2,a); s=bs+(WS-bs)*a; l=bl+(WL-bl)*a;}
    const al=Math.min(1,o.a*IA*(.8+.55*p.amt+(o.e||o.wh?.25:0)));
    if(al<.02) continue;
    const depth=o.z?1-o.z*.35:1, r=(o.e?1.25:o.wh?1.1:.95)*(1+p.amt*.55)*depth*dpr;
    ctx.fillStyle=`hsla(${h|0},${s|0}%,${l|0}%,${al.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill();
  }

  ctx.globalCompositeOperation='source-over'; ctx.lineWidth=dpr;
  for(const wv of waves){
    const age=T-wv.t0; if(age<0) continue; const rad=age*sp, pr=rad/(R*2.4); if(pr>=1) continue;
    ctx.strokeStyle=`hsla(${wv.h|0},${WS}%,${WL}%,${(.22*(1-pr)*wv.str).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(wv.x,wv.y,rad,0,TAU); ctx.stroke();
  }
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
renderVerse(0,1,true);
resize();
setSoundIcon();
$('count').textContent='01 / 09';
requestAnimationFrame(frame);
})();
