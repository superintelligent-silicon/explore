<style>
/* Layout (The Third Party): a single-leaf 3D flipbook; each chapter's point-cloud art is printed on the page as a plate and turns with it. Black, silver, one gold accent. */
:root{
  --ink:#0b0c0e;
  --paper:#141518;
  --paper-2:#1a1b1f;
  --line:#2b2d33;
  --dim:#3a3d44;
  --silver:#c5c8ce;
  --mute:#8d9199;
  --hi:#eef0f3;
  --gold:#d9a72a;
  --gold-hi:#ecc459;
  --bad:#ff8f72;
  --good:#7fd9a6;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--silver)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

#ui{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(10px + env(safe-area-inset-top, 0px));padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events:none;opacity:0;transition:opacity .9s ease}
body.entered #ui{opacity:1}
#ui > *{min-width:0}
.top{display:flex;align-items:center;gap:8px;pointer-events:auto}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.brand b{font-family:var(--display);font-style:italic;font-weight:500;font-size:17px;color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(20,21,24,.72);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:inline-grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,background .2s}
.ic:hover{border-color:var(--dim)}
.ic:disabled{opacity:.32;cursor:default}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.txt{padding:0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center}
.ic.txt i{width:7px;height:7px;border-radius:50%;background:var(--gold)}

main{display:flex;flex-direction:column;gap:10px;min-height:0}
.cloudzone{flex:0 0 clamp(140px, 25vh, 300px);transition:flex-basis .9s cubic-bezier(.3,.7,.2,1)}
body.is-cover .cloudzone{flex-basis:clamp(200px, 44vh, 460px)}
.bookwrap{flex:1 1 auto;min-height:0;position:relative;pointer-events:auto;max-width:560px;width:100%;margin:0 auto}

.foot{display:flex;align-items:center;gap:10px;pointer-events:auto;max-width:560px;width:100%;margin:0 auto}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prog .lbl{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.prog .lbl b{color:var(--silver);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--silver),var(--gold));transition:width .6s ease}

@media (min-width:900px){
  main{flex-direction:row;gap:28px}
  .cloudzone,body.is-cover .cloudzone{flex:1 1 auto}
  .bookwrap{flex:0 0 min(540px, 46vw);margin:0}
  .foot{margin:0 0 0 auto;max-width:min(540px, 46vw)}
}

/* Book */
.book{position:absolute;inset:0;perspective:2200px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.book::before,.book::after{content:"";position:absolute;top:6px;bottom:-4px;left:6px;right:-5px;border-radius:4px 14px 14px 4px;background:#101114;border:1px solid #1f2125;z-index:0}
.book::after{top:3px;bottom:-2px;left:3px;right:-2.5px;background:#121316}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transform:rotateY(0deg);will-change:transform;z-index:1}
.leaf.anim{transition:transform .8s cubic-bezier(.32,.72,.2,1)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:1px solid var(--line);
  border-radius:4px 14px 14px 4px;background:
  linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,0) 22px),
  radial-gradient(120% 90% at 100% 0%, #1c1d22 0%, var(--paper) 60%);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg, rgba(0,0,0,.75), rgba(0,0,0,.15));opacity:var(--shade,0)}
.back{transform:rotateY(180deg);border-radius:14px 4px 4px 14px;background:
  linear-gradient(270deg, rgba(0,0,0,.55), rgba(0,0,0,0) 22px),
  repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.025) 23px 24px),
  repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.025) 23px 24px), var(--paper)}
.back .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:300;font-size:140px;color:#1e2025;font-variant-numeric:tabular-nums}
.back .num small{position:absolute;bottom:18px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#34373e;text-transform:uppercase}

.content{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding:20px 20px 40px 30px;display:flex;flex-direction:column;gap:12px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent);
  scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.content > *{margin:0;flex:none}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.eyebrow svg.i{width:15px;height:15px;color:var(--gold-hi)}
.eyebrow span{color:var(--gold);font-variant-numeric:tabular-nums}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;color:var(--hi);text-wrap:balance;margin:0}
h2{font-size:clamp(22px, 5.6vw, 28px);line-height:1.12;letter-spacing:-.005em}
h3{font-size:22px;line-height:1.15}
h4{font-size:16px;line-height:1.2}
.content p{text-wrap:pretty;max-width:62ch}
.small{font-size:13.5px;color:var(--mute)}
.cap-note{font-size:12px;color:var(--mute);font-style:italic}
.content b,.sheet b{color:var(--hi);font-weight:600}

.cover{display:flex;flex-direction:column;gap:14px;min-height:100%;justify-content:center}
.cover h1{font-weight:300;font-size:clamp(44px, 12vw, 64px);line-height:.98;letter-spacing:-.02em}
.cover h1 em{font-style:italic;color:var(--gold-hi)}
.dek{font-family:var(--display);font-weight:300;font-size:18px;line-height:1.4;color:var(--silver)}
.hint{display:flex;gap:10px;align-items:flex-start;font-family:var(--mono);font-size:11px;line-height:1.5;letter-spacing:.04em;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.hint svg.i{color:var(--gold-hi);margin-top:1px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badges span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--silver)}
.badges svg.i{width:14px;height:14px;color:var(--gold-hi)}

/* icon rows */
.irows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.irows li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;align-items:start;font-size:14.5px}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold-hi);background:rgba(217,167,42,.06)}
.ib svg.i{width:18px;height:18px}
.irows li small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:1px}

/* glossary */
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gt{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.012)}
.gt .th{display:flex;gap:7px;align-items:center;color:var(--hi);font-weight:600;font-size:13px;line-height:1.2}
.gt .th svg.i{width:16px;height:16px;color:var(--gold-hi)}
.gt p{font-size:12.5px;line-height:1.42;color:var(--silver)}
@media (max-width:360px){.gloss{grid-template-columns:1fr}}

/* sand-to-network flow */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:start}
.flow div{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center}
.flow .c{width:40px;height:40px;border-radius:50%;border:1px solid var(--dim);display:grid;place-items:center;color:var(--silver);background:var(--paper)}
.flow div:last-child .c{border-color:var(--gold);color:var(--gold-hi)}
.flow div:not(:last-child)::after{content:"";position:absolute;top:20px;left:calc(50% + 24px);width:calc(100% - 44px);height:1px;background:linear-gradient(90deg,var(--dim),var(--mute))}

/* shell windows */
.shellbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0e0f11}
.shellbox .tb{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.06em}
.shellbox .tb i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.shellbox .tb span{margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shellbox pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--silver);white-space:pre-wrap;word-break:break-word}
.pr{color:var(--gold)} .dm{color:var(--mute)}
.tag{display:inline-block;padding:0 6px;margin-left:6px;border-radius:4px;font-size:10px;line-height:16px;border:1px solid currentColor;letter-spacing:.06em;text-transform:uppercase}
.bad{color:var(--bad)} .good{color:var(--good)}
.hl-key{color:var(--bad);background:rgba(255,143,114,.1);border-radius:3px;padding:0 2px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-top:1px solid var(--dim);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-weight:600;font-size:clamp(16px, 4.6vw, 20px);color:var(--hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11.5px;line-height:1.35;color:var(--mute)}

.bars{display:flex;flex-direction:column;gap:9px}
.bars .cap{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.bars .cap svg.i{width:14px;height:14px;color:var(--gold-hi)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
.row .lab{font-size:13px}
.row .val{font-family:var(--mono);font-size:12.5px;color:var(--hi);font-variant-numeric:tabular-nums}
.row .bar{grid-column:1/-1;height:7px;background:#202227;border-radius:2px;overflow:hidden}
.row .fill{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#8e929a,var(--silver));transform-origin:left;transition:transform 1.1s cubic-bezier(.3,.7,.2,1) .35s}
.row.gold .fill{background:linear-gradient(90deg,#a87d1c,var(--gold-hi))}
.leaf:not(.current) .fill{transform:scaleX(.02)}

.note{display:grid;grid-template-columns:34px minmax(0,1fr);gap:11px;align-items:center;font-size:13.5px;color:var(--silver);border:1px dashed var(--dim);border-radius:10px;padding:10px}

ol.tl{list-style:none;margin:0 0 0 6px;padding:0 0 0 16px;border-left:1px solid var(--dim);display:flex;flex-direction:column;gap:11px}
ol.tl li{position:relative;font-size:14px}
ol.tl li::before{content:"";position:absolute;left:-21.5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--silver)}
ol.tl li.hot::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(217,167,42,.6)}
ol.tl time{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
ol.tl time svg.i{width:13px;height:13px}

/* scaled mini timelines */
.mt{position:relative;margin:28px 6px 34px}
.mt .ln{position:relative;height:2px;background:var(--dim)}
.mt .ln.hot{background:linear-gradient(90deg,var(--silver),var(--bad))}
.mt .mk{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--silver);transform:translateX(-50%)}
.mt .mk.g{border-color:var(--gold);background:var(--gold)}
.mt .mk.r{border-color:var(--bad);background:var(--bad)}
.mt .lb{position:absolute;top:14px;font-family:var(--mono);font-size:10px;line-height:1.3;color:var(--silver);white-space:nowrap}
.mt .lb small{display:block;color:var(--mute);font-size:9.5px}
.mt .lb.up{top:auto;bottom:12px}
.mt .lb.c{transform:translateX(-50%);text-align:center}
.mt .lb.r{transform:translateX(-100%);text-align:right}
.mt .band{position:absolute;top:-7px;height:16px;right:0;background:repeating-linear-gradient(45deg,rgba(217,167,42,.3) 0 4px,transparent 4px 8px);border-radius:3px}
.mt .bandlb{position:absolute;bottom:14px;right:0;font-family:var(--mono);font-size:9.5px;color:var(--gold-hi);white-space:nowrap}

.dots{display:flex;flex-wrap:wrap;gap:3px;padding:4px 0}
.dots i{width:5px;height:5px;border-radius:50%;background:#33363c}
.dots i.hit{background:var(--gold-hi);box-shadow:0 0 8px var(--gold)}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(255,255,255,.015);display:flex;flex-direction:column;gap:7px}
.card .ch{display:flex;align-items:center;gap:8px}
.card .ch svg.i{color:var(--good)}
.card.warm .ch svg.i{color:var(--bad)}
.card p{font-size:13px;line-height:1.45}
@media (max-width:380px){.duo{grid-template-columns:1fr}}

svg.fig{display:block;width:100%;max-width:100%;height:auto}
.fig .ax{fill:none;stroke:var(--dim);stroke-width:1}
.fig .c1{fill:none;stroke:var(--mute);stroke-width:1.6;stroke-dasharray:4 4}
.fig .c2{fill:none;stroke:var(--gold-hi);stroke-width:2.2}

function decayPath(L){ let d=''; for(let k=0;k<=48;k++){ const t=k/48, x=38+t*270, y=14+82*(1-Math.exp(-t/L)); d+=(k?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); } return d; }
function scribbles(){ let d='', x=118; const rows=[34,48]; let seed2=3; const r2=()=>(seed2=(seed2*48271)%2147483647)/2147483647;
  rows.forEach((y,ri)=>{ x=118+ri*10; while(x<300){ const w=14+r2()*26; d+=`M${x.toFixed(1)} ${y}`; for(let s=0;s<w;s+=4){ d+=`q2 ${(-5-r2()*3).toFixed(1)} 4 0`; } x+=w+8; } });
  return d; }
const moreBtn = (id,label) => `<button class="more" data-more="${id}">${ico('plus')}${label}</button>`;

const figChain=(()=>{

/* a mortgage payment vs. owning outright: the bill that never ends */
const figForever=(()=>{
  const x0=40, x1=308, yrs=40, X=y=>x0+(x1-x0)*y/yrs;
  let s=`<svg class="fig" viewBox="0 0 320 120" role="img" aria-label="Over forty years, a thirty-year mortgage ends but the property tax bill continues every year, usually rising.">`;
  s+=`<text x="4" y="34">LOAN</text><rect x="${x0}" y="24" width="${X(30)-x0}" height="14" rx="2" class="seg s growx" ${dl(0,0,.3)}/><text x="${X(30)+4}" y="35" >PAID OFF</text>`;
  s+=`<text x="4" y="66" class="t2">TAX</text>`;
  for(let y=0;y<yrs;y++){ const h=6+y*.35; s+=`<rect x="${(X(y)+.6).toFixed(1)}" y="${(70-h).toFixed(1)}" width="${((x1-x0)/yrs-1.4).toFixed(1)}" height="${h.toFixed(1)}" rx="1" class="seg g pop" ${dl(y,.03,.6)}/>`; }
  [0,10,20,30,40].forEach(y=>{ s+=`<text x="${X(y)}" y="88" text-anchor="middle">${y?('YR '+y):'BUY'}</text>`; });
  s+=`<text x="4" y="112">Illustration. The loan ends. The tax bill keeps coming.</text></svg>`;
  return s;
})();

/* ------------------------------------------------------------ Land systems people have tried */
/* [id, name, where and when, who holds the land, what you owe, what worked, what went wrong] */
const SYSTEMS=[
 ['commons','The commons','Medieval and early modern England','Villagers shared customary rights to graze, gather and farm open fields.','Customary dues to the manor.','Families with little or no land of their own could still feed themselves.','Over 5,200 enclosure bills between 1604 and 1914 fenced about 6.8 million acres, a fifth of England, often pushing commoners off.'],
 ['manor','The feudal manor','Medieval Europe','A lord, who held it from someone above him and ultimately the crown.','Two or three days a week of labor on the lord\'s land, part of your own crops, a church tithe and fees.','Stability, protection and a guaranteed place to farm.','Serfs were bound to the estate and couldn\'t simply leave. The system weakened after the Black Death made labor scarce.'],
 ['jubilee','The Jubilee','Ancient Israel, in biblical law','Families held land as tenants of God, not as permanent owners.','Land returned to its original family every fiftieth year.','No one could pile up their neighbors\' land forever.','Historians aren\'t sure how often it was actually practiced.'],
 ['wellfield','The well-field','Ancient China, as described by Mencius','Eight families each farmed an outer plot of a nine-square grid.','Together they worked the center plot for the lord.','A simple rule that everyone could see and check.','It was mostly an ideal, and historians doubt it ever worked that neatly.'],
 ['waqf','The waqf','The Islamic world, over many centuries','Land permanently endowed for a religious, charitable or family purpose, run by a custodian.','Nothing to a lord. The income went to the purpose, such as a school or hospital.','It couldn\'t be sold or confiscated, which protected schools, mosques and public services.','Land was locked up for good, and modern governments took over much of its regulation.'],
 ['mahele','Ahupuaʻa and the Māhele','Hawaiʻi, before and after 1848','Before: land divisions running from the mountains to the sea, managed under chiefs. After: land split among the crown, the government and the chiefs.','Before: labor and goods. After: purchase prices and taxes.','Each community had a full slice of what it needed, from forest to reef.','When commoners got the chance to claim land, the awards totaled about 28,658 acres, under 1% of the islands.'],
 ['homestead','The Homestead Act','United States, 1862 to 1986','Families who lived on and farmed 160 acres for five years.','Small filing fees, then ordinary property tax.','About 1.6 million homesteads covering 270 million acres, roughly a tenth of the country.','It was built on Native land, and Native people couldn\'t file unless they renounced tribal citizenship.'],
 ['sharecrop','Sharecropping','The U.S. South after the Civil War','Landowners, many of them former enslavers.','A share of the crop, plus debts to merchants who lent against the next harvest.','Families without land could at least farm.','Crop liens trapped many families in debt year after year, and almost no freed people received land.'],
 ['collective','Collective farms','The Soviet Union from 1929, China from 1958','The state, through collectives.','Work quotas and forced grain deliveries.','It promised shared ownership of everything.','Famine. About 5.7 to 8.7 million died in the Soviet Union in 1932–33, and estimates for China\'s Great Leap famine mostly fall between 30 and 46 million.'],
 ['tiller','Land to the tiller','Japan 1946–50, South Korea from 1950, Taiwan 1953','Tenant farmers became owners of the land they worked.','Payments on the land, usually far below market price.','In Japan, tenant-farmed land fell from 46% in 1941 to 9% by 1955. In Taiwan, owner-farmed land rose from 57% to 90%.','It meant forced sales, and landlords were often paid in bonds or company shares.'],
 ['ejido','The ejido','Mexico, after the 1917 Constitution','Communities hold land and families farm their parcels.','Duties to the community assembly.','It secured land for rural families after the revolution, and ejido and communal land still covers about half of Mexico.','Parcels were hard to sell or borrow against. A 1992 reform allowed private titles, yet only about 3% has been privatized.'],
 ['china','State land with long leases','China today','The state owns urban land and collectives own rural land.','A land-use right, typically 70 years for homes, which renews automatically. The renewal fee is still undecided.','Cities could build fast, funded largely by leasing land.','Owners hold a right that ends on paper, and a national property tax remains a pilot, with Shanghai\'s extended to 2031.'],
 ['singapore','Public leasehold','Singapore today','The state owns about 90% of the land. Most homes are 99-year leases from the Housing and Development Board.','The purchase price of the lease, often paid from mandatory savings.','About 77% of resident households live in these flats, and 91% of households own their homes.','A lease is a countdown, and the state sets most of the rules about who can buy and sell.'],
 ['vienna','Social housing','Vienna since 1919','The city and nonprofit builders.','Rent, kept below market by public funding.','43% of Vienna\'s households live in subsidized housing. A housing tax from 1923 helped build about 64,000 flats in eleven years.','It depends on a city willing to keep funding it for a century.'],
 ['lvt','Land value tax','Estonia since 1993, Denmark since 1924, Pennsylvania cities, Taiwan','Private owners.','A tax on the value of the land only, not on the buildings.','You aren\'t taxed more for building, fixing or improving, which rewards using land well.','Valuing land separately is hard, and Pittsburgh dropped its version in 2001 after reassessment appeals.'],
 ['clt','Community land trust','United States since the 1980s, about 314 programs today','A nonprofit trust owns the land, and the resident owns the house.','A small ground lease, and a resale formula when you move.','Homes stay affordable for the next buyer. Burlington, Vermont\'s trust now stewards thousands of homes.','You give up most of the upside. At Burlington\'s trust, sellers keep 25% of the appreciation.'],

{chap:'Cover', icon:'key', shape:'key', cover:true, html:`<div class="cover">
  <div class="eyebrow">${ico('key')}<span>00</span>An essay</div>
  <h1>The Third <em>Party</em></h1>
  <p class="dek">Two people want to make a deal. Somewhere far away, a stranger who will never meet either of them gets to decide whether they can.</p>
  <p class="hint">${ico('hand')}<span>Swipe or tap the page edge to turn. Tap a drawing to spread color through it, drag it to turn it.</span></p></div>`},

{chap:'The short version', icon:'book', html:`
<h2>The whole idea in five points</h2>
${irows([
 ['users',`<b>Most deals start with two people.</b> One has a room, a job or a loan to offer, and the other wants it.`],
 ['stamp',`<b>More and more, a third party decides.</b> A credit bureau, a screening company, an algorithm or an assessor that neither side has ever met.`],
 ['alert',`<b>Be careful whenever that happens.</b> The stranger in the middle answers to whoever pays it, and it's rarely the person being judged.`],
 ['search',`<b>The checks don't always check.</b> Records are wrong, scores get gamed, references get bought and degrees get faked, yet the system keeps trusting the paper.`],
 ['door',`<b>"That's just the way it is" isn't true.</b> Most of this was built within living memory, and things people built can be changed, or simply walked away from.`]
])}`},

/* ---------------- Part I */
{chap:'Two people at a table', label:'Part I · Two people and a stranger', icon:'users', shape:'table', html:`
<h2>A deal used to fit at a kitchen table</h2>
<p>For most of history, renting a room or hiring a hand worked about the same way everywhere. Two people sat down, looked each other in the eye, asked a few questions, maybe called someone they both knew, and then decided. If it went badly, they knew exactly who to talk to about it.</p>
<p>That system had real problems, and we'll get to them. But it had one quality that's easy to miss now. The person making the decision was the same person who had to live with it, and the person being judged could see who was doing the judging.</p>
<p>Today a lot of everyday deals have a third seat at the table, and nobody is sitting in it. There's a report, a score, a database or a formula, built by a company the two people will never meet, and more and more often that empty chair gets the final word.</p>
<p class="pull">The first question to ask about any deal is a simple one. Who else is in this, and who are they working for?</p>`},

{chap:'It\'s not up to me', label:'Part I · Two people and a stranger', icon:'stamp', shape:'stamp', html:`
<h2>"I'd love to have you, but it's not up to me"</h2>
<p>Anyone who has rented an apartment through official channels has probably heard some version of this. The person across the desk likes you, the place suits you, and you can pay. Then the screening report comes back, and suddenly nobody in the room is responsible for the answer.</p>
${figTriangle}
<p>That shift is the heart of this essay. A third party doesn't just add information to a decision, it moves the decision somewhere else. The landlord gets to say no without having to own the no. The renter gets a rejection with no face on it, often with criteria so vague there's nothing to argue with.</p>
<p>That's why a third party you don't know, and will never meet, deserves a moment of suspicion. It isn't always bad. But it's always worth asking whose interests it was built to protect, and whether yours were part of the design at all.</p>`},

{chap:'Count the strangers', label:'Part I · Two people and a stranger', icon:'users', html:`
<h2>Count the strangers in one apartment</h2>
<p>A single lease can quietly involve a whole crowd. Tap each one below to add it to the deal, and see who it really answers to.</p>
${deal_html}
<p class="cap-note">A typical arrangement for a large apartment building. Small landlords may involve only one or two of these.</p>`},

{chap:'That\'s just the way it is', label:'Part I · Two people and a stranger', icon:'sign', shape:'signpost', html:`
<h2>It wasn't always like this</h2>
<p>People who say "that's just the way it is" usually mean it's always been this way and always will be. The history says otherwise. Most of the machinery that sits between two people today was built in the last hundred and fifty years, and much of it in the last fifty.</p>
<ol class="tl">
<li><time>${ico('book')}1841</time>The Mercantile Agency starts rating merchants on character, marital status and ethnicity.</li>
<li><time>${ico('users')}1899</time>Retail Credit Company opens in Atlanta. It later becomes Equifax.</li>
<li><time>${ico('gavel')}1970</time>The Fair Credit Reporting Act sets the first federal rules for these files.</li>
<li><time>${ico('scale')}1974</time>The Equal Credit Opportunity Act bans credit discrimination by sex and marital status. Race is added in 1976.</li>
<li><time>${ico('pulse')}1989</time>The general-purpose FICO score arrives.</li>
<li class="hot"><time>${ico('house')}Today</time>About 9 in 10 landlords use tenant screening reports.</li>
</ol>
<p>None of this fell from the sky. People designed it, voted for parts of it, and profit from it. That's actually good news, because anything people built, people can rebuild.</p>
<p class="pull">It may be how things are right now. That's a long way from how things have to be.</p>`},

/* ---------------- Part II */
{chap:'You pay to be judged', label:'Part II · The renter\'s file', icon:'card', shape:'card', html:`
<h2>You pay for your own screening</h2>
<p>Stop and look at this arrangement for a second. The landlord wants to know whether you're a safe bet, so the landlord orders a report from a company the landlord chose, and then hands you the bill for it.</p>
${rcpt('One rental application',[['Application fee you pay','$40–59'],['What the report costs the landlord','$25–35'],['Copy of the decision logic','not included','neg'],['Refund if you\'re turned down','usually none','neg']],'Typical ranges reported by the Consumer Financial Protection Bureau, 2022.')}
<p>Apply to five places in a tight market and you can spend a few hundred dollars just to be looked at, with no guarantee anyone looks closely. Some states have noticed. New York caps screening charges at the actual cost or $20, whichever is less. Massachusetts and Rhode Island don't allow application fees. Colorado makes landlords accept a recent portable report that you already paid for once, so you don't pay again and again.</p>
<p>So the fee isn't a law of nature. In most of the country it's simply what renters have been trained to accept, one application at a time.</p>`},

{chap:'Who checks the landlord?', label:'Part II · The renter\'s file', icon:'search', shape:'magnifier', html:`
<h2>The check only runs one way</h2>
<p>If a background check is about trust, it's fair to ask why trust only has to be earned in one direction. A renter is about to hand over a deposit, their safety and the place they sleep. That's a much bigger risk than most landlords take on.</p>
${figAsym}
<p>A renter who wants to vet a landlord has to do the work alone, digging through court records, code violations and online reviews. New York City publishes a yearly Worst Landlord Watchlist ranked by open housing violations, which shows how useful this kind of information can be when someone bothers to collect it. Texas law lets a tenant demand the owner's name and address in writing within seven days. Those are exceptions, though, not the rule.</p>
<p>When only one side can be investigated, the check isn't really about trust. It's about who holds the power, and it quietly keeps that power where it already is.</p>`},

{chap:'The record that stays', label:'Part II · The renter\'s file', icon:'cabinet', shape:'cabinet', more:`
<h3>Clearing a record, in plain terms</h3>
<p>Finishing probation or deferred adjudication usually does not erase anything by itself. In most places you have to ask a court to seal or expunge the record, and the rules depend on the state and the charge. In Texas, for example, people who complete deferred adjudication generally have to petition for an order of nondisclosure, and even then some agencies can still see it.</p>
<p>Fourteen states and Washington, D.C. now have Clean Slate laws that clear some eligible records automatically, without anyone having to file. If you live somewhere without one, a local legal aid office can usually tell you what you qualify for and how much it costs.</p>
<p>Federal law also helps a little. Screening companies can't report an arrest that didn't lead to a conviction once it's more than seven years old, though convictions can be reported forever, and anything newer than seven years is fair game.</p>`, html:`
<h2>The record that was supposed to disappear</h2>
<p>Picture someone who was arrested once, never convicted, and offered probation. They're told that if they finish it, the whole thing goes away. They finish it. Years later, they apply for an apartment and get turned down because the arrest is still sitting in a screening report.</p>
<p>That story is common, and it usually isn't anyone lying. Completing probation often doesn't clear the record on its own. The arrest and court entries stay in public files unless the person goes back and asks a court to seal them, which many people never learn they need to do. Meanwhile, data companies have already copied the old version.</p>
<p>Federal law lets a screening company report an arrest without a conviction for seven years, and a conviction indefinitely. Regulators have caught big screening firms going further. TransUnion's rental screening arm paid $15 million in 2023 over reports that, among other things, showed sealed evictions and listed dismissed cases as judgments. AppFolio paid $4.25 million over records older than the seven-year limit, and RealPage paid $3 million for matching people to criminal records that belonged to someone else.</p>
<p>Oversight has also been moving backward. In 2025 the Consumer Financial Protection Bureau withdrew its guidance warning screeners against matching people by name alone and against reporting sealed records. The law's basic accuracy requirement still stands, but the referee has stepped back from the field.</p>
${moreBtn('records','How records actually get cleared')}`},

{chap:'Rules that don\'t add up', label:'Part II · The renter\'s file', icon:'scale', shape:'scales', html:`
<h2>The same file, a different answer</h2>
<p>Screening is sold as objective, but it often works like a slot machine with paperwork. One person gets denied over a single arrest that never became a conviction, while someone else with several convictions moves in down the hall, because the two buildings bought different software or set different cutoffs.</p>
${stats([['1 in 5','had an error on a credit report in an FTC study'],['34%','found at least one error in a 2021 Consumer Reports test'],['5.8M','credit reporting complaints to the CFPB in 2025']])}
<p>Even when the data is right, it may not predict much. A Minnesota study of more than 10,500 households found that 11 of 15 types of criminal offense had no significant effect on whether a tenant broke the lease or failed to pay, and the effects that did exist faded after a few years.</p>
<p>Some will say credit and background screening can't be discrimination because they're just numbers. But numbers that are often wrong, applied inconsistently, and only loosely tied to the outcome they claim to predict can sort people unfairly just as well as a biased person can. The only difference is that it's harder to argue with a printout.</p>`},

/* ---------------- Part III */
{chap:'When the house became a bond', label:'Part III · The house as a spreadsheet', icon:'coin', shape:'coins', html:`
<h2>When the house became a bond</h2>
<p>After World War II, most home loans in the U.S. came from local banks and savings institutions that kept them on their own books. The lender lived in the same town as the borrower and had a reason to care whether the loan made sense.</p>
<p>In February 1970, Ginnie Mae marketed its first mortgage-backed security, a bundle of home loans sold to investors as a single bond. Freddie Mac followed, and in 1977 Bank of America and Salomon Brothers sold the first private one. Within a couple of decades, a monthly house payment could pass through a servicer, a trust and a bond fund before reaching anyone who owned a piece of it.</p>
${figChain}
<p>After the 2008 crash, large investors bought foreclosed homes at depressed prices and turned them into rentals, with some help from a federal pilot program that sold Fannie Mae's foreclosures in bulk. By 2022, the biggest owners held about 450,000 single-family homes. That's only around 3% of single-family rentals nationally, but about a quarter of them in metro Atlanta, where the effect on neighborhoods was hard to miss.</p>
<p class="cap-note">GAO, 2024. Shares are of single-family rentals, not of all homes.</p>`},

{chap:'The algorithm in the middle', label:'Part III · The house as a spreadsheet', icon:'building', shape:'tower', html:`
<h2>The algorithm in the middle</h2>
<p>A newer third party sits between landlords themselves. Rent-pricing software gathers data from many buildings and recommends what each one should charge. When competing landlords feed the same system and follow its advice, renters can end up facing what looks like one landlord wearing many name tags.</p>
<p>The Justice Department and several states sued the largest of these companies, RealPage, in 2024. In a settlement approved in 2026, RealPage agreed to stop using competitors' private, real-time data and to remove features that discouraged price cuts, though it paid no penalty. The states' own case is still going, and separate renter lawsuits have reached about $360 million in proposed settlements.</p>
<p>The software's pitch was revealing. Its former chief executive once described a client that earned more by accepting lower occupancy and higher rents. A 2026 study presented at the Federal Trade Commission found buildings using such software charged more and kept more units empty during strong markets. Meanwhile, California, New York and cities from San Francisco to Seattle have restricted or banned this kind of shared rent-setting.</p>
<p class="pull">A unit sitting empty at a high price can look better on a spreadsheet than a family living in it at a fair one.</p>`},

{chap:'Someone else\'s lifestyle', label:'Part III · The house as a spreadsheet', icon:'house', html:`
<h2>Paying for someone else's lifestyle</h2>
<p>Nearly half of American renters, a record 22.7 million households, paid more than 30% of their income for housing in 2024. The median rent rose about 37% in just five years, from $1,088 in 2019 to $1,498 in 2024.</p>
${bars('Median U.S. gross rent','house',[{l:'2019',v:'$1,088',w:73},{l:'2024',v:'$1,498',w:100,g:1}])}
<p class="cap-note">Harvard Joint Center for Housing Studies, State of the Nation's Housing 2026.</p>
<p>It's fair to say that landlords take on real costs and real risks, and that wanting a profit isn't a crime. A rented-out home still houses a family, so it isn't the same as a home sitting empty. But the system has drifted toward treating rent as something to maximize rather than something to make fair, and the renter becomes a line on a balance sheet that carries someone else's mortgage, taxes and returns.</p>
<p>There's also slack in the system. The Census Bureau counts about 6.5 million housing units held off the market for reasons other than being for rent or sale, including roughly 2 million kept for occasional use. When people sleep in cars a few blocks from empty rooms, "the market will sort it out" stops sounding like an explanation.</p>`},

{chap:'Build your own', label:'Part III · The house as a spreadsheet', icon:'hammer', shape:'cabin', html:`
<h2>What if you just built it yourself?</h2>
<p>This used to be ordinary. Sears sold an estimated 70,000 to 75,000 mail-order house kits between 1908 and 1940, and buyers could put them together with their own hands. In 1949, federal statisticians found that owner-builders put up about 27% of new private homes.</p>
<p>Henry David Thoreau built his own cabin at Walden Pond in 1845 and listed every expense in his book, which came to $28.12½. His point wasn't that everyone should live in a shack. It was that most people never stop to count how much of their life goes to paying for shelter that someone else designed.</p>
<p>That number fell as building codes and zoning spread. Codes exist for real reasons. A house that burns can take the neighbors' houses with it, which is why the first national codes followed big city fires. Protecting the people next door is a fair job for a rulebook.</p>
<p>Protecting someone from their own humble choices is a different matter. Many towns set minimum house sizes, and courts have upheld them, including a 768-square-foot minimum in a famous 1952 New Jersey case. Model codes now offer rules for homes of 400 square feet or less, but only where a town chooses to adopt them.</p>
<p>We say small cabins and shacks are banned for people's own safety, while many of those same people sleep outside on the sidewalk tonight. If we're honest with ourselves, a sound little shelter that endangers no one else is safer than the street, and it's a strange kind of care that forbids the first and tolerates the second.</p>`},

/* ---------------- Part IV */
{chap:'Owning, sort of', label:'Part IV · What owning means', icon:'crown', shape:'crown', html:`
<h2>The dream of finally owning it</h2>
<p>For a lot of people, owning a home is the way out of all of this. No more landlord, no more screening, no more rent going to someone else's mortgage. You save, you buy, you pay it off, and then it's yours.</p>
<p>Then the first property tax bill arrives, and the next, and they keep coming after the mortgage is gone. Miss enough of them and the government can take the house. Plenty of people who started out excited about owning end up feeling like they're still paying rent, just to a different landlord who never fixes anything.</p>
${figForever}
<p>The feeling has deep roots. The legal word for full ownership in the U.S. is "fee simple," and "fee" comes from the old feudal fief, land held from a lord while the crown kept the final say. There is no truly tax-free, outright land ownership in America today. Nevada briefly offered something like it starting in 1997, then closed the program to new applicants in 2005.</p>
<p>The government can also take land outright through eminent domain. In 2005, the Supreme Court's Kelo decision allowed a Connecticut city to take homes for a private redevelopment plan. The public backlash was strong enough that 43 states tightened their laws afterward, and the project's anchor company left town anyway in 2010.</p>`},

{chap:'Who decides what it\'s worth', label:'Part IV · What owning means', icon:'stamp', more:`
<h3>Why property tax exists, and its best version</h3>
<p>Property tax pays for a lot of things people rely on. In 2020 it supplied about 72% of local governments' own tax revenue, and in 2020–21 it covered about 36% of all K–12 school funding. Any plan to shrink it has to answer where that money comes from instead, whether that's sales taxes, income taxes, state aid or cuts.</p>
<p>Some economists argue that the fairest version taxes only the land itself, not the house you built on it. Henry George made that case in 1879, and Milton Friedman later called a tax on the unimproved value of land "the least bad tax." The idea is that you didn't create the land's value, but you did create your house, so you shouldn't be punished for building or fixing it up.</p>
<p>In 1776, Adam Smith listed four rules for a fair tax in The Wealth of Nations. It should match people's ability to pay, be "certain, and not arbitrary," be collected when it's convenient to pay, and cost as little as possible to collect. A bill that depends on a stranger's yearly estimate of a home you have no plans to sell struggles with the second rule most of all.</p>
<p>Others want broader caps, larger homestead exemptions, or to end property tax on primary homes entirely. Every option has trade-offs, and reasonable people land in different places. The common ground is that a tax shouldn't be able to push a paid-off owner out of their home over a number they had no real say in.</p>`, html:`
<h2>The assessor is a third party too</h2>
<p>The part that stings most is that you don't decide what your home is worth, and neither does the market until you sell. A county assessor estimates its value, local officials set a rate, and the bill follows. Your house can get "more valuable" every year without you gaining a dollar in your pocket, and the tax rises anyway.</p>
<p>The estimates aren't evenly fair. A University of Chicago team studied a decade of home sales and found that, on average, the cheapest tenth of homes paid an effective tax rate more than double that of the most expensive tenth, a pattern found in most counties. In Detroit, researchers estimated that inflated assessments caused about 10% of tax foreclosures between 2011 and 2015.</p>
${rcpt('Tyler v. Hennepin County, 2023',[['Owner\'s age','94'],['Actual unpaid tax','about $2,300'],['Debt after interest and fees','about $15,000','neg'],['County\'s sale price','$40,000'],['Kept by the county','$25,000','neg']],'The Supreme Court ruled 9–0 that keeping the extra equity was an unconstitutional taking.')}
<p>Fixing a wrong number takes time, knowledge and often a lawyer, so the people who need it most use it least. In Cook County, Illinois, about 56% of properties in majority-white neighborhoods appealed their assessments over three recent cycles, compared with about 16% in majority-Black neighborhoods.</p>
<p>Some places also sell unpaid tax bills to private investors, who then collect interest from the owner. Iowa allows up to 24% a year. That's one more stranger standing between a person and the house they thought they owned.</p>
<p>People are pushing back. California and Florida cap how fast assessments can rise, Texas voters raised the school homestead exemption to $140,000 in 2025, and Florida voters decided on November 3, 2026 whether to expand exemptions further. Efforts to abolish property tax entirely have so far fallen short, including North Dakota's in 2024, which lost about 63% to 37%.</p>
${moreBtn('proptax','The case for property tax, and its fairest form')}`},

{chap:'The slow eviction', label:'Part IV · What owning means', icon:'house', html:`
<h2>Try it on a house that's already paid off</h2>
<p>Here's how a bill can outgrow the person paying it. Set how fast the assessor says your home's value is rising, how fast your income is rising, and what share of your income the tax takes today.</p>
${tax_html}
<p class="cap-note">An illustration that holds the tax rate steady. Real bills also move with local rates, exemptions and caps.</p>
<p>Nothing in this picture requires anyone to act in bad faith. The house is the same house and the owner is the same owner, but a number set by someone else keeps climbing faster than the owner's paycheck, until staying put becomes a stretch. That's why caps like California's and Florida's exist, and why so many people who have them refuse to move.</p>`},

/* ---------------- Part V */
{chap:'Older than the country', label:'Part V · The old arguments', icon:'column', shape:'column', html:`
<h2>People have argued about this for three thousand years</h2>
<p>The question of who really owns land, and what anyone owes for holding it, is much older than any modern country. Two very different answers show up almost from the start, and they're still with us.</p>
<blockquote class="old">The land shall not be sold for ever: for the land is mine; for ye are strangers and sojourners with me.<cite>Leviticus 25:23</cite></blockquote>
<p>The first answer treats land as something held in trust. Under the biblical Jubilee, every fiftieth year land was supposed to return to the families it originally belonged to, so no one could pile up their neighbors' fields forever.</p>
<p>The second answer treats ownership as a shield. Aristotle argued against Plato's idea of shared property because people take care of what's theirs, writing that "that which is common to the greatest number has the least care bestowed upon it." In 1215, English barons forced King John to accept Magna Carta, which promised that no free man would be "disseised," meaning stripped of his land, except by the lawful judgment of his peers or the law of the land.</p>
<p class="pull">One idea says land belongs to everyone across time. The other says what's yours should be safe from the powerful. Both are trying to protect ordinary people.</p>`},

{chap:'Locke\'s bargain', label:'Part V · The old arguments', icon:'quill', shape:'quill', html:`
<h2>Locke's bargain: work, property and consent</h2>
<p>The thinker the American founders leaned on most was John Locke, an English philosopher writing around 1690. His argument was simple enough to fit on a napkin. When a person works on something nobody owns, such as clearing a field, they've "mixed his labour with" it, and it becomes theirs. Governments exist mainly to protect that.</p>
<p>Locke attached two conditions that people tend to forget. The first is that taking land is only fair when there's "enough, and as good, left in common for others." The second is about taxes.</p>
<blockquote class="old">The supreme power cannot take from any man any part of his property without his own consent.<cite>John Locke, Second Treatise of Government, §138</cite></blockquote>
<p>He didn't oppose taxes. He said everyone who benefits from protection should pay their share, but only with consent given through representatives, because otherwise "what property have I in that, which another may by right take, when he pleases, to himself?"</p>
<p>To be fair about Locke, his "unowned land" was often land other people already lived on, and his ideas were used to justify taking Native American land. The great English judge William Blackstone admitted something similar in 1766. He called property "that sole and despotic dominion" a person claims over things, then noted that very few people ever bother to think about where that right came from.</p>`},

{chap:'What the founders did', label:'Part V · The old arguments', icon:'bell', shape:'bell', html:`
<h2>What the founders said, and what they did</h2>
<blockquote class="old">Property must be secured, or liberty cannot exist.<cite>John Adams, Discourses on Davila, 1790</cite></blockquote>
<p>The American Revolution started as a tax fight. In 1765, colonial delegates resolved that no taxes should be imposed on them except with their own consent, the idea later shortened to "no taxation without representation." James Madison went further in 1792, writing that just as a man has a right to his property, "he may be equally said to have a property in his rights," and that government fails when "unequal taxes oppress one species of property and reward another."</p>
<p>The Bill of Rights built some of this into law. The Fifth Amendment says private property can't be taken for public use "without just compensation." The Third Amendment, which almost nobody thinks about, bars quartering soldiers in any house "without the consent of the Owner." It's the original rule against an unwanted third party moving into your home.</p>
<p>But the founders also taxed land and houses. In 1798, Congress passed a direct tax on dwellings, land and enslaved people. Assessors measured houses and counted windows, and in Pennsylvania farmers resisted, some by dumping hot water on the assessors. When John Fries led armed men to free jailed protesters in 1799, he was convicted of treason twice and sentenced to hang, until President Adams pardoned him. A decade earlier, in 1789, Ben Franklin had written that in this world nothing is certain "except death and taxes."</p>
<p>Honesty requires one more thing. Around 1790, ten of the thirteen states let only property owners or taxpayers vote, and the same laws that protected property treated enslaved people as property. The founders' promise was real, but it took generations of struggle to extend it to everyone it described.</p>`},

{chap:'The other tradition', label:'Part V · The old arguments', icon:'tree', shape:'tree', html:`
<h2>The other tradition: the earth belongs to the living</h2>
<p>Not everyone in that generation saw property as untouchable. In 1789, Thomas Jefferson wrote to Madison that "the earth belongs in usufruct to the living," meaning each generation gets to use and enjoy it but not to lock it up for the next one. Thomas Paine, whose Common Sense helped start the Revolution, argued in 1797 that every owner of cultivated land "owes to the community a ground-rent" for it. He proposed using that money to pay every person fifteen pounds at age 21 and ten pounds a year from age 50, as their share of the earth.</p>
<p>The English philosopher Jeremy Bentham went further, saying property and law "are born and must die together," because without laws, nothing is really owned. In 1879 the American writer Henry George concluded, "We must make land common property," by which he meant taxing the value of land itself while leaving people's homes and work untaxed.</p>
${duo([
 [0,'quill','Property as a natural right','Locke, Adams and Madison. You own what you earn, and government exists to protect it. Taxes need your consent and must be fair.'],
 [0,'tree','Property as a shared trust','Jefferson, Paine, Bentham and George. Land is a common inheritance, so holding it carries a duty back to the community.']
])}
<p>What's striking is that the two sides disagree about almost everything, yet neither one describes a system where a stranger with a spreadsheet can quietly price a paid-off family out of its home. One side wanted taxes kept small, fair and consented to. The other wanted land's unearned value shared with everyone. Our system often manages to miss both.</p>`},

/* ---------------- Part VI */
{chap:'Every way it\'s been tried', label:'Part VI · Around the world', icon:'globe', shape:'globe', html:`
<h2>Every way it's been tried</h2>
<p>When people say there's no other way to handle land and housing, history quietly disagrees. Humans have tried almost every arrangement you can imagine, from shared village fields to lords and serfs to land that legally belongs to God. Tap through the older ones and notice who holds the land and who decides.</p>
${sys_html(['commons','manor','jubilee','wellfield','waqf','mahele','homestead','sharecrop','collective'])}`},

{chap:'Modern experiments', label:'Part VI · Around the world', icon:'globe', html:`
<h2>What countries are trying now</h2>
<p>The experiments didn't stop. Some countries turned tenants into owners almost overnight, some keep nearly all land in public hands and lease it out, and some tax only the land itself. Each one makes a different trade between freedom, security and fairness.</p>
${sys_html(['tiller','ejido','china','singapore','vienna','lvt','clt','coop','titling'])}`},

{chap:'What the options teach', label:'Part VI · Around the world', icon:'globe', shape:'fence', html:`
<h2>What all those options teach</h2>
<p>Put the whole tour side by side and a few patterns show up that cut across politics.</p>
${irows([
 ['crown',`<b>Someone almost always holds the last word.</b> A lord, a crown, a state, a trust or a county. Pure ownership with no one above you is rare in history, which makes the real question how accountable that someone is.`],
 ['users',`<b>The systems that crushed people put decisions far away.</b> Enclosure commissioners, distant lords, Soviet planners and crop-lien merchants all decided for people they didn't have to face.`],
 ['house',`<b>Spreading ownership widely has worked.</b> Postwar land reform in Japan, Taiwan and South Korea made millions of tenants into owners, and those countries went on to grow quickly.`],
 ['scale',`<b>Clear, stable rules beat clever ones.</b> A fixed share, a known cap or a written resale formula is easier to live with than a number that changes every year on someone else's say.`],
 ['door',`<b>The freedom to leave matters.</b> Serfs couldn't leave the manor and sharecroppers couldn't leave their debts. Any system that makes walking away impossible deserves suspicion.`]
])}
<p>Nobody has found a perfect system, and anyone who claims one should be asked a lot of questions. But the world clearly isn't stuck with only one option, and the ones that respect people tend to share a single habit. They keep the person who decides close enough to the person affected that the two can look each other in the eye.</p>`},

/* ---------------- Part V */
{chap:'The paper says qualified', label:'Part VII · Stamps that verify nothing', icon:'cap', shape:'cap', html:`
<h2>The paper says qualified</h2>
<p>A college degree is a third party too. A school you attended once vouches for you to an employer who has never met you, and that stamp follows you for life. The idea is reasonable. The execution leaks.</p>
<p>A 2018 review of 65 studies found that about one in seven students in recent surveys admitted paying someone else to do their work. England banned commercial essay mills in 2022, and Australia fined a homework company A$500,000 in 2026 under a similar law. Paid note-takers, tutoring services that drift into doing the work, and now AI have all made it easier to buy the appearance of learning. In 2019, the Varsity Blues case showed parents paying a fixer about $25 million in total to get their kids admitted to elite schools in the first place.</p>
<p>Meanwhile, students without money for shortcuts sit through every hour of the same requirements. Two people can leave with identical diplomas and very different educations, and the paper can't tell them apart.</p>
${bars('How well each predicts job performance','cap',[{l:'Work sample test',v:'r = .54',w:100,g:1},{l:'Reference check',v:'r = .26',w:48},{l:'Years of education',v:'r = .10',w:19}])}
<p class="cap-note">Schmidt and Hunter, Psychological Bulletin, 1998. A correlation of 1.0 would be a perfect prediction.</p>
<p>That's why Maryland, Pennsylvania, Utah and other states dropped degree requirements for most state jobs, and why a group called Opportunity@Work counts more than 70 million American workers who learned their skills another way. Changing the job posting turned out to be easier than changing the habit, though. A 2024 Harvard and Burning Glass study found that very few actual hires changed.</p>`},

{chap:'References and other fiction', label:'Part VII · Stamps that verify nothing', icon:'mail', shape:'envelope', html:`
<h2>References, and other fiction</h2>
<p>Job references are supposed to be the human check, a real person vouching for another. In practice, many employers won't give them at all. A SHRM survey found that 54% of organizations refused, mostly out of fear of lawsuits.</p>
<p>The ones that do get given can be invented. Companies have openly sold fake supervisors for this purpose. One Minnesota service charged $54 a month in 2013, and another sold a reporter a package with a fake HR line, a fake company website and a fake map listing for $150. In a 2025 survey of job applicants, about one in four admitted lying on a résumé.</p>
<p>The same thing happens with credit and court records. The FTC shut down a business that sold spots on strangers' credit cards for $325 to $4,000 so buyers could borrow someone else's good history, and another that filed thousands of false identity-theft reports to scrub accurate debts from people's files. In California, a court clerk took about $420,000 in bribes to quietly fix more than a thousand cases, including 69 drunk-driving charges.</p>
<p>What rarely gets said out loud is that people who lie their way past these checks often go on to do the job just fine. That doesn't prove lying is good. It suggests the checks weren't measuring the thing that mattered, and that the honest people paying full price for the process are the only ones really bound by it.</p>`},

/* ---------------- Part VI */
{chap:'The paycheck problem', label:'Part VIII · Seeing it', icon:'eye', html:`
<h2>Why so few people see it</h2>
<p>In 1935, the writer Upton Sinclair described how hard it is to get a man to understand something, "when his salary depends upon his not understanding it." Nearly a century later, that line explains a lot of what we've just walked through.</p>
<p>Every third party in this story employs people. Screening companies, credit bureaus, appraisers, assessors, lenders, software firms, admissions offices and the consultants who advise all of them are paid to keep the system running. Most of them are decent people doing a normal job. They simply don't get paid to ask whether the job should exist.</p>
<p>Then there's everyone else, who copies what they see. A landlord charges an application fee because other landlords do. An owner raises the rent because the software says the market will bear it. Each step feels small and reasonable on its own, and fear does the rest, because nobody wants to be the one who trusted a stranger and got burned.</p>
<p>It doesn't help that breaking the rules is often cheap. The Economic Policy Institute estimated that employers' minimum-wage violations cost workers up to $15 billion a year, more than all the property crime losses the FBI recorded in 2015. RealPage's federal settlement carried no financial penalty at all. When getting caught costs less than the profit, the lesson people learn isn't to stop. It's to budget for it.</p>
<p>The result is a lot of people who privately share the same frustrations and publicly say "that's just the way it is." They aren't insane, and neither is the person who says it doesn't have to be. Usually they're just tired, and that's understandable. Tired isn't the same as wrong, though.</p>`},

{chap:'The case for the third party', label:'Part VIII · Seeing it', icon:'bridge', shape:'bridge', html:`
<h2>The best case for the stranger in the middle</h2>
<p>To be fair, third parties weren't invented only to squeeze people. Some were invented to protect them. When lenders judged people face to face, they often judged badly. Early credit agencies rated people on ethnicity and "character." Before 1974, women were routinely asked for a husband's or father's signature to get a credit card. A Philadelphia Fed review concluded that automated scoring may reduce opportunities for that kind of personal bias, even if it doesn't remove unfair outcomes.</p>
<p>But the history also shows the other side. The 1930s redlining maps that marked Black neighborhoods as hazardous were drawn by a federal agency, a third party that turned prejudice into official policy. A stranger in the middle can remove bias, or it can bake it in and make it look neutral.</p>
${duo([
 [0,'bridge','A good bridge','Clear rules you can read, mistakes you can fix quickly, checks that run both ways, and a fee paid by the side that benefits.'],
 [1,'lock','A toll gate','Secret criteria, errors you can\'t correct, one-way checks, and a fee charged to the person already struggling to get in.']
])}
<p>So the goal isn't to tear down every bridge between strangers. Strangers do need some way to trust each other. The goal is to keep inspecting the bridges, and to notice when one has quietly turned into a toll gate.</p>`},

{chap:'Saying no', label:'Part VIII · Seeing it', icon:'door', shape:'door', html:`
<h2>You're allowed to say no</h2>
<p>The most underrated power in any deal is the willingness to walk away. When a third party you'll never meet is about to decide something important about your life, it's reasonable to pause and ask whether you want in.</p>
${irows([
 ['quote',`<b>Ask for the criteria in writing.</b> If someone can't say exactly what disqualifies you, you can't know whether they followed their own rules.`],
 ['card',`<b>Bring your own report.</b> Where the law allows, offer a recent copy instead of paying for another, and ask about it everywhere else.`],
 ['search',`<b>Check them back.</b> Look up the owner, court records and code violations before you sign, and ask who you're really renting from.`],
 ['doc',`<b>Clean up your file.</b> Pull your credit reports, dispute errors, and find out whether an old record can be sealed.`],
 ['users',`<b>Deal person to person when it's safe.</b> Many of the best arrangements start with someone who knows someone.`],
 ['gavel',`<b>Push for small fixes.</b> Fee caps, portable reports, automatic record clearing and two-way disclosure already exist in some places, which proves they can exist in yours.`]
])}
<p>None of this requires a revolution. It requires enough people to stop treating the stranger in the middle as a law of nature, and start treating it as a deal term that can be questioned like any other.</p>`},

{chap:'Back to the table', label:'Part VIII · Seeing it', icon:'users', shape:'table', html:`
<h2>Back to the table</h2>
<p>Most of us don't actually want a world without rules or records. We want one where the rules are clear, the records are accurate, and the people making a decision have to look at the person it affects.</p>
<p>That's not a radical wish. It's how a lot of life worked within living memory, and it's how the best parts of life still work, like the friend who vouches for you, the landlord who meets you for coffee, or the boss who gives you a trial week instead of a personality test.</p>
<p>Every time we choose to deal directly, to check both ways, to fix a wrong record or to walk away from a bad deal, the empty chair at the table gets a little less powerful. Enough people doing that, and "that's just the way it is" starts to sound like what it really is, which is a habit.</p>
<p class="pull">Two people, looking at each other, deciding together. It still works. We just have to keep choosing it.</p>`},

let ac=null, master=null, soundOn=true;
function initAudio(){
  if(ac) return;
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .85; master.connect(ac.destination);
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.Q.value=.7;
    const g = ac.createGain(); g.gain.value = 0;
    [55, 82.41, 110.3, 164.8].forEach((f,i)=>{ const o=ac.createOscillator(); o.type = i>1?'triangle':'sine'; o.frequency.value=f; o.detune.value=(i-1.5)*5; const og=ac.createGain(); og.gain.value=[.7,.5,.18,.08][i]; o.connect(og).connect(lp); o.start(); });
    const lfo = ac.createOscillator(); lfo.frequency.value=.06; const lg=ac.createGain(); lg.gain.value=160; lfo.connect(lg).connect(lp.frequency); lfo.start();
    lp.connect(g).connect(master);
    g.gain.setValueAtTime(0, ac.currentTime); g.gain.linearRampToValueAtTime(.055, ac.currentTime+4);
  }catch(e){ ac=null; }
}
function sFlip(){
  if(!ac||!soundOn) return;
  const t=ac.currentTime, len=.34;
  const buf=ac.createBuffer(1, Math.floor(ac.sampleRate*len), ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const k=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-k,2.2)*(.6+.4*Math.sin(k*40)); }
  const src=ac.createBufferSource(); src.buffer=buf;
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.9;
  bp.frequency.setValueAtTime(2600,t); bp.frequency.exponentialRampToValueAtTime(420,t+len);
  const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.32,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+len);
  src.connect(bp).connect(g).connect(master); src.start(t);
}
const notes=[392, 440, 523.25, 587.33, 659.25, 783.99];
function sSplash(k){
  if(!ac||!soundOn) return;
  const t=ac.currentTime, base=notes[k%notes.length];
  [[1,.15,'sine',1.8],[2.003,.05,'triangle',1.2],[3.01,.022,'sine',.8],[4.2,.01,'sine',.5]].forEach(([m,pk,type,dur])=>{
    const o=ac.createOscillator(); o.type=type; o.frequency.setValueAtTime(base*m*1.015,t); o.frequency.exponentialRampToValueAtTime(base*m,t+.35);
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(pk,t+.015); g.gain.exponentialRampToValueAtTime(.0006,t+dur);
    o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
  });
}
function sClick(){
  if(!ac||!soundOn) return;
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type='sine'; o.frequency.setValueAtTime(980,t); o.frequency.exponentialRampToValueAtTime(640,t+.06);
  g.gain.setValueAtTime(.07,t); g.gain.exponentialRampToValueAtTime(.0008,t+.09);
  o.connect(g).connect(master); o.start(t); o.stop(t+.1);
}
function setSound(on){
  soundOn=on;
  document.getElementById('sndOn').hidden=!on; document.getElementById('sndOff').hidden=on;
  const b=document.getElementById('soundBtn'); b.setAttribute('aria-pressed', on?'true':'false'); b.setAttribute('aria-label', on?'Sound on':'Sound off');
  if(ac&&master){ master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(on?.85:0, ac.currentTime+.25); }
}

function fit(a,size){ let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  for(let i=0;i<N;i++) for(let k=0;k<3;k++){ const v=a[i*3+k]; if(v<mn[k]) mn[k]=v; if(v>mx[k]) mx[k]=v; }
  const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2], s=size/Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]);

const TAU=Math.PI*2;
/* point on a tube from p to q, radius r */
function tube(p,q,r){ const t=R(), th=R()*TAU; const d=[q[0]-p[0],q[1]-p[1],q[2]-p[2]], L=Math.hypot(...d)||1, u=[d[0]/L,d[1]/L,d[2]/L];

  const w=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]], c=Math.cos(th)*r, s=Math.sin(th)*r;
  return [p[0]+d[0]*t+v[0]*c+w[0]*s, p[1]+d[1]*t+v[1]*c+w[1]*s, p[2]+d[2]*t+v[2]*c+w[2]*s]; }
/* point on a disc (axis y) with radius r */

const rot3=(p,rx,ry,rz)=>{ let [x,y,z]=p, c, s;
  c=Math.cos(rx); s=Math.sin(rx); [y,z]=[y*c-z*s, y*s+z*c];
  c=Math.cos(ry); s=Math.sin(ry); [x,z]=[x*c+z*s, -x*s+z*c];
  c=Math.cos(rz); s=Math.sin(rz); [x,y]=[x*c-y*s, x*s+y*c]; return [x,y,z]; };

/* ------------------------------------------------------------ Shapes for The Third Party */
const boxP=(c,w,h,d)=>{ const p=onBox(w,h,d); return [p[0]+c[0],p[1]+c[1],p[2]+c[2]]; };
function boxE(c,w,h,d,r){ const ax=Math.floor(R()*3), dims=[w,h,d], q=[0,0,0];
  q[ax]=(R()-.5)*dims[ax]; q[(ax+1)%3]=(R()<.5?-1:1)*dims[(ax+1)%3]/2; q[(ax+2)%3]=(R()<.5?-1:1)*dims[(ax+2)%3]/2;
  return [c[0]+q[0]+J(r||0),c[1]+q[1]+J(r||0),c[2]+q[2]+J(r||0)]; }
/* a box drawn mostly by its edges, partly by its faces */
const boxMix=(c,w,h,d,e)=>R()<(e==null?.45:e)?boxE(c,w,h,d,.008):boxP(c,w,h,d);
/* cylinder (axis y) side or caps */
function cyl(c,r,h,capFrac){ const th=R()*TAU;
  if(R()<(capFrac||0)){ const p=disc(r); return [c[0]+p[0], c[1]+(R()<.5?-h/2:h/2), c[2]+p[2]]; }
  return [c[0]+r*Math.cos(th), c[1]+(R()-.5)*h, c[2]+r*Math.sin(th)]; }
/* torus around axis y */
function tor(R0,r0){ const a=R()*TAU, b=R()*TAU; return [(R0+r0*Math.cos(b))*Math.cos(a), r0*Math.sin(b), (R0+r0*Math.cos(b))*Math.sin(a)]; }
/* extrude a 2D shape (inside test) to thickness th, with a share of points on the outline */
function ext(inside,x0,x1,y0,y1,th,rim){
  if(R()<rim){ for(let g=0;g<400;g++){ const x=x0+R()*(x1-x0), y=y0+R()*(y1-y0); if(!inside(x,y)) continue; const a=R()*TAU, e=.022; if(!inside(x+e*Math.cos(a),y+e*Math.sin(a))) return [x,y,(R()-.5)*th]; } }
  for(let g=0;g<200;g++){ const x=x0+R()*(x1-x0), y=y0+R()*(y1-y0); if(inside(x,y)) return [x,y,(R()<.5?-1:1)*th/2]; }
  return [0,0,0]; }
const lerp3=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t];
const add3=(p,q)=>[p[0]+q[0],p[1]+q[1],p[2]+q[2]];
/* a simple gabled house, mostly drawn by its edges; footprint w x d, wall height h */
function housePt(w,h,d,rh){
  const r=R(), hw=w/2, hd=d/2;
  if(r<.34) return boxE([0,h/2,0],w,h,d,.006);
  if(r<.5){ const p=onBox(w,h,d); return [p[0],p[1]+h/2,p[2]]; }
  if(r<.66){ /* roof planes */ const s=R()<.5?-1:1, t=R(), x=J(w*1.1); return [x, h+rh*(1-t), s*(hd*1.08)*t]; }
  if(r<.76){ /* roof edges: ridge, eaves, rakes */ const q=R(); if(q<.35) return [J(w*1.1),h+rh,0]; if(q<.7) return [J(w*1.1),h,(R()<.5?-1:1)*hd*1.08];
    const sx=R()<.5?-1:1, sz=R()<.5?-1:1, t=R(); return [sx*w*.55, h+rh*(1-t), sz*hd*1.08*t]; }
  if(r<.84){ /* gable triangles */ const sx=R()<.5?-1:1, t=Math.sqrt(R()), z=(R()-.5)*2*hd*(1-t*0)+0; const y=h+R()*rh; const lim=hd*(1-(y-h)/rh); return [sx*hw, y, (R()*2-1)*lim]; }
  if(r<.9){ /* door on front (+z) */ const p=rrPer(w*.2,h*.62,.01); return [p[0]-w*.18, p[1]+h*.31, hd+.004]; }
  if(r<.97){ /* windows */ const k=R()<.5?-1:1, p=R()<.7?rrPer(w*.2,h*.26,.01):[J(w*.2),J(h*.26)]; const front=R()<.6; if(front) return [p[0]+w*.22, p[1]+h*.56, hd+.004]; return [k*(hw+.004), p[1]+h*.55, p[0]*.9]; }
  /* chimney */ return boxP([w*.26,h+rh*.75,-hd*.4],w*.1,rh*.6,w*.1);
}

const SH = {
  /* a house key on a ring */
  key(){ const a=out();
    const tooth=x=>{ const k=Math.floor((x-.86)/.16); const d=[.11,.04,.13,.07,.12,.03][((k%6)+6)%6]; const f=(x-.86-k*.16)/.16; return d*Math.min(1,Math.min(f,1-f)*4); };
    const inside=(x,y)=>{
      if(Math.hypot(x,y)<.56) return Math.hypot(x+.24,y)>.13;
      if(x>=.46&&x<=.66) return Math.abs(y)<.24;
      if(x>.66&&x<2.06){ let top=.15, bot=-.17; if(x>.86&&x<1.82) bot=-.17+tooth(x); if(x>1.9){ const t=(x-1.9)/.16; top=.15-t*.12; bot=-.17+t*.17; } return y<top&&y>bot; }
      return false; };
    for(let i=0;i<N;i++){ const r=R(); let p;
      if(r<.82) p=ext(inside,-.6,2.1,-.6,.6,.075,.5);
      else if(r<.88){ const x=.72+R()*1.15; p=[x,.04+J(.01),(R()<.5?-1:1)*.04]; }
      else { const q=tor(.46,.028); const c=Math.cos(1.1), s=Math.sin(1.1); p=[q[0]-.24-.46, q[1]*c-q[2]*s, q[1]*s+q[2]*c]; p=[p[0]+.0, p[1], p[2]]; }
      put(a,i,p[0],p[1],p[2]); }
    return fit(rotX(rotY(rotZ(a,.32),-.42),.18),2.6); },

  /* two chairs facing across a table, a paper between them */
  table(){ const a=out(), TW=1.5, TD=.9, TY=.0;
    const chair=(sz)=>{ const r=R(), z0=sz*.78;
      if(r<.24) return boxMix([0,-.34,z0],.56,.05,.52,.5);
      if(r<.5){ const lx=R()<.5?-.24:.24, lz=R()<.5?-.22:.22; return tube([lx,-.36,z0+lz],[lx,-.84,z0+lz],.022); }
      if(r<.62){ const lx=R()<.5?-.24:.24; return tube([lx,-.34,z0+sz*.25],[lx,.42,z0+sz*.27],.024); }
      if(r<.78) return boxMix([0,.36,z0+sz*.27],.56,.12,.04,.55);
      const k=Math.floor(R()*3); return tube([-.12+k*.12,-.32,z0+sz*.26],[-.12+k*.12,.3,z0+sz*.27],.014); };
    for(let i=0;i<N;i++){ const r=R(); let p;
      if(r<.2) p=boxMix([0,TY,0],TW,.06,TD,.55);
      else if(r<.32){ const lx=R()<.5?-TW/2+.07:TW/2-.07, lz=R()<.5?-TD/2+.07:TD/2-.07; p=tube([lx,TY-.03,lz],[lx,-.86,lz],.03); }
      else if(r<.66){ const q=chair(1); p=[q[2]*1.25,q[1],q[0]]; }
      else if(r<.92){ const q=chair(1); p=[-q[2]*1.25,q[1],-q[0]]; }
      else if(r<.97){ const q=R(); if(q<.5){ const t=rrPer(.34,.46,.005); p=[t[0]-.1,TY+.035,t[1]]; } else { const j=Math.floor(R()*7); p=[-.24+R()*.26,TY+.035,-.17+j*.055]; } }
      else p=tube([.14,TY+.045,-.1],[.36,TY+.045,.12],.008);
      put(a,i,p[0],p[1],p[2]); }
    return fit(rotX(rotY(a,-.5),.34),2.5); },

  /* a rubber stamp lifted over a stamped page */
  stamp(){ const a=out(), Y0=-.62;
    for(let i=0;i<N;i++){ const r=R(); let p;
      if(r<.1){ const s=sph(.26); p=[s[0]+.34,1.02+s[1]*.92,s[2]]; }
      else if(r<.2){ const t=R(), rr=.09+.05*Math.pow(Math.abs(t-.5)*2,2), th=R()*TAU; p=[.34+rr*Math.cos(th),.38+t*.5,rr*Math.sin(th)]; }
      else if(r<.24){ const p2=disc(.25); p=[.34+p2[0],.36,p2[2]]; }
      else if(r<.44) p=boxMix([.34,.18,0],1.0,.3,.72,.5);
      else if(r<.52) p=boxMix([.34,-.03,0],.92,.1,.64,.6);
      else if(r<.66){ const t=rrPer(2.5,1.6,.02); p=[t[0]-.08,Y0,t[1]]; if(R()<.4){ p=[J(2.5)-.08,Y0,J(1.6)]; } }
      else if(r<.76){ const t=rrPer(.9,.6,.03); p=[t[0]-.72,Y0+.005,t[1]+.12]; }

        if(q<.4){ x=cx+J(.012); z=.12+J(.24); } else if(q<.7){ x=cx+R()*.08; z=.12+(R()<.5?-.12:.12); } else { x=cx+R()*.08; z=.12+J(.02); }
        p=[x,Y0+.006,z]; }
      else { const t=rrPer(.78,.48,.02); p=[t[0]-.72,Y0+.005,t[1]+.12]; }
      put(a,i,p[0],p[1],p[2]); }
    return fit(rotX(rotY(a,-.2),.62),2.5); },

  /* a crossroads signpost */
  signpost(){ const a=out();
    const arrow=(x,y)=>Math.abs(y)<.13&&x>-.62&&x<.46 || (x>=.46&&x<.66&&Math.abs(y)<(.66-x)*1.0);
    const boards=[[.62,.25,0],[.26,-.5,2.3],[-.1,.15,3.7]];
    for(let i=0;i<N;i++){ const r=R(); let p;

      else if(r<.22){ const s=sph(.08); p=[s[0],.88+s[1],s[2]]; }
      else if(r<.82){ const b=boards[Math.floor(R()*3)]; let q=ext(arrow,-.64,.68,-.22,.22,.06,.55); if(R()<.18){ q=[-.5+R()*.85,J(.02),(R()<.5?-1:1)*.035]; }
        q=[q[0]+.55,q[1],q[2]]; const c=Math.cos(b[2]), s=Math.sin(b[2]); p=[q[0]*c+q[2]*s, q[1]+b[0], -q[0]*s+q[2]*c]; }

      put(a,i,p[0],p[1],p[2]); }

  /* a payment card in front of a second card */
  card(){ const a=out(), W=1.7, H=1.07;
    const front=()=>{ const r=R();
      if(r<.3){ const p=rrPer(W,H,.1); return [p[0],p[1],J(.03)]; }
      if(r<.44){ const p=rrIn(W,H,.1); return [p[0],p[1],.016]; }
      if(r<.6){ const q=R(); if(q<.45){ const p=rrPer(.26,.2,.04); return [p[0]-.5,p[1]+.12,.022]; } const j=Math.floor(R()*3); return [-.5+J(.24),.04+j*.08,.022]; }
      if(r<.82){ const g=Math.floor(R()*4), k=Math.floor(R()*4); return [-.66+g*.36+k*.075+J(.03),-.16+J(.06),.026]; }
      if(r<.9){ return [-.66+R()*.62,-.36+J(.025),.022]; }
      { const k=1+Math.floor(R()*3), th=(R()-.5)*1.1; return [.55+k*.06*Math.cos(th),.14+k*.06*Math.sin(th),.022]; } };
    for(let i=0;i<N;i++){ let p;

      else { const q=R(); let pp; if(q<.4){ const t=rrPer(W,H,.1); pp=[t[0],t[1],J(.03)]; } else if(q<.7){ pp=[J(W*.98),.3+J(.18),-.02]; } else { const t=rrIn(W,H,.1); pp=[t[0],t[1],-.016]; }
        pp=rot3(pp,0,0,.32); p=[pp[0]+.34,pp[1]+.3,pp[2]-.24]; }
      put(a,i,p[0],p[1],p[2]); }
    return fit(rotX(rotY(a,-.38),.12),2.5); },

  /* a magnifying glass held over a small house */
  magnifier(){ const a=out(), RC=[-.25,.42,.35];
    for(let i=0;i<N;i++){ const r=R(); let p;
      if(r<.26){ const t=tor(.62,.055); p=[t[0],t[2],t[1]]; p=add3(p,RC); }
      else if(r<.34){ const d=disc(.6); p=add3([d[0],d[2],.03*(1-(d[0]*d[0]+d[2]*d[2])/.36)],RC); }
      else if(r<.4){ const o=[RC[0]+.48,RC[1]-.48,RC[2]]; p=tube(o,add3(o,[.18,-.18,0]),.07); }

  /* a filing cabinet with the top drawer pulled open */
  cabinet(){ const a=out(), W=.92, H=1.9, D=.86, DH=H/4;
    for(let i=0;i<N;i++){ const r=R(); let p;

      else if(r<.5){ const k=1+Math.floor(R()*3), cy=H/2-DH/2-k*DH; const q=R(); let t;
        if(q<.55){ t=rrPer(W*.9,DH*.86,.02); p=[t[0],t[1]+cy,D/2+.01]; }
        else if(q<.8){ t=rrPer(.3,.05,.02); p=[t[0],t[1]+cy-.06,D/2+.03]; }
        else { t=rrPer(.2,.08,.005); p=[t[0],t[1]+cy+.14,D/2+.012]; } }
      else if(r<.66){ const cy=H/2-DH/2, z0=D/2+.32; const q=R();
        if(q<.5) p=boxE([0,cy,z0-.32],W*.9,DH*.86,D*.92+.04,.006);

      else { const k=Math.floor(R()*9), z=D/2+.27-k*.075, cy=H/2-DH/2, ht=DH*.62+(k%3)*.03; let x=J(W*.78), y=cy-DH*.36+R()*ht;

  /* scales, tipped */
  scales(){ const a=out(), TIP=.2, BY=1.0, L=1.05;
    const end=s=>[s*L*Math.cos(TIP), BY-s*L*Math.sin(TIP), 0];
    for(let i=0;i<N;i++){ const r=R(); let p;

      else if(r<.24){ const q=R(); if(q<.6){ const d=disc(.55); p=[d[0],-1.06,d[2]]; } else { const th=R()*TAU, rr=.55-R()*.25; p=[rr*Math.cos(th),-1.06+R()*.1*(1-(.55-rr)/.25),rr*Math.sin(th)]; } }

        else { const d=Math.sqrt(R())*.46, th=R()*TAU; p=[e[0]+d*Math.cos(th), py-.16*(1-(d*d)/(.46*.46))*(R()<.85?1:R()), d*Math.sin(th)]; if(R()<.4){ p=[e[0]+.46*Math.cos(th),py,.46*Math.sin(th)]; } }

  /* a house sitting on a stack of coins */
  coins(){ const a=out(), CR=.62, CH=.09, NC=9;

        if(q<.55){ const th=R()*TAU; p=[CR*Math.cos(th)+off[0],y+J(CH*.8),CR*Math.sin(th)+off[2]]; if(R()<.3){ const th2=Math.floor(R()*90)/90*TAU; p=[CR*1.01*Math.cos(th2)+off[0],y+J(CH*.7),CR*1.01*Math.sin(th2)+off[2]]; } }
        else if(q<.8){ const th=R()*TAU, rr=CR-.005; p=[rr*Math.cos(th)+off[0],y+(R()<.5?-1:1)*CH*.45,rr*Math.sin(th)+off[2]]; }

  /* apartment blocks wired to one box floating above them */
  tower(){ const a=out(), T=[[-.9,1.3,.5],[0,1.9,.62],[.88,1.05,.5]], HUB=[0,1.35,.55];
    const bld=(b)=>{ const [x,h,w]=b, d=w*.85, c=[x,-1+h/2,0], q=R();

      const cols=3, rows=Math.max(3,Math.round(h/.2)), ci=Math.floor(R()*cols), ri=Math.floor(R()*rows);
      const wx=-w/2+w*(ci+.5)/cols, wy=-h/2+h*(ri+.6)/(rows+.4), t=rrPer(w/cols*.55,h/rows*.45,.004);

    for(let i=0;i<N;i++){ const r=R(); let p;

      else { const k=Math.floor(R()*3), b=T[k], top=[b[0],-1+b[1],0], t=R(); p=lerp3([HUB[0],HUB[1]-.11,HUB[2]],top,t); p[1]+=Math.sin(t*Math.PI)*.12; p=add3(p,[J(.01),J(.01),J(.01)]); }
