  /* a crown */
  crown(){ const a=out(), RB=.78, HB=.34, NP=8;
    const topY=th=>{ const k=th/TAU*NP, f=k-Math.floor(k); return HB/2+.5*Math.pow(1-Math.abs(f-.5)*2,1.4); };
    for(let i=0;i<N;i++){ const r=R(); let p;

      else if(r<.76){ const k=Math.floor(R()*NP), th=(k+.5)/NP*TAU, s=sph(.055); p=[(RB+.02)*Math.cos(th)+s[0],topY(th)+.05+s[1],(RB+.02)*Math.sin(th)+s[2]]; }
      else if(r<.88){ const k=Math.floor(R()*NP), th=k/NP*TAU+.0, s=sph(.07); const rr=RB+.05; p=[rr*Math.cos(th)+s[0]*.6,s[1],rr*Math.sin(th)+s[2]*.6]; }
      else { const k=Math.floor(R()*4), an=k/4*TAU, t=R(); const base=[RB*.96*Math.cos(an),HB/2+.05,RB*.96*Math.sin(an)]; const apex=[0,.72,0]; p=lerp3(base,apex,t); p[1]+=Math.sin(t*Math.PI)*.18; if(R()<.18){ const s=sph(.09); p=[s[0],.82+s[1],s[2]]; } }

  /* a small one-room cabin */
  cabin(){ const a=out(), W=1.3, H=.78, D=.95, RL=.36;

let chunks=[], leaves=[], flipped=[], cur=0;
const eyebrowFor=(p,pi,cont)=>`<div class="eyebrow">${ico(p.icon)}<span>${pad(pi)}</span>${p.label||p.chap}${cont?' <em class="cont">· cont.</em>':''}</div>`;
function paginate(){
  const coverOn=document.body.classList.contains('is-cover');
  document.body.classList.add('measuring'); document.body.classList.remove('is-cover'); void book.offsetHeight;
  const ml=document.createElement('div'); ml.className='leaf'; ml.style.visibility='hidden'; ml.style.zIndex=0;
  ml.innerHTML='<div class="face front"><div class="content"></div></div>'; book.appendChild(ml);
  const m=ml.querySelector('.content'), fits=()=>m.scrollHeight<=m.clientHeight+1, out=[];
  pages.forEach((p,pi)=>{
    if(p.cover){ out.push({src:pi,p,html:p.html,cont:false}); return; }
    const tmp=document.createElement('div'); tmp.innerHTML=p.html; const blocks=[...tmp.children];
    let first=true;
    const start=()=>{ m.innerHTML=eyebrowFor(p,pi,!first); };
    const flush=()=>{ out.push({src:pi,p,html:m.innerHTML,cont:!first}); first=false; start(); };
    start();
    const isHead=el=>el&&/^H[1-4]$/.test(el.tagName);
    const flushKeep=()=>{ const carry=[]; while(isHead(m.lastElementChild)&&m.children.length>2){ carry.unshift(m.lastElementChild); m.removeChild(m.lastElementChild); } flush(); carry.forEach(c=>m.appendChild(c)); };
    const splitP=b=>{ const sents=b.innerHTML.match(/[\s\S]+?[.!?]["\u201d']?(?:\s+|$)|[\s\S]+$/g)||[b.innerHTML];
      let cp=b.cloneNode(false); m.appendChild(cp);
      for(const sn of sents){ const prev=cp.innerHTML; cp.innerHTML=prev+sn; if(fits()) continue;
        if(!prev){ if(m.children.length>2){ m.removeChild(cp); flushKeep(); cp=b.cloneNode(false); m.appendChild(cp); cp.innerHTML=sn; } continue; }
        cp.innerHTML=prev; flush(); cp=b.cloneNode(false); m.appendChild(cp); cp.innerHTML=sn; } };
    for(const b of blocks){
      m.appendChild(b); if(fits()) continue;
      m.removeChild(b);
      if(b.tagName==='P'&&!b.matches('.pull,.small')){ splitP(b); continue; }
      if(b.tagName==='UL'||b.tagName==='OL'||b.matches('.gloss,.stats')){
        let shell=b.cloneNode(false); m.appendChild(shell);
        for(const li of [...b.children]){
          shell.appendChild(li); if(fits()) continue;
          shell.removeChild(li); if(!shell.children.length) m.removeChild(shell);
          if(m.children.length>1) flushKeep();
          shell=b.cloneNode(false); m.appendChild(shell); shell.appendChild(li);
        }
        continue;
      }
      const carry=[];
      if(b.matches('.more,.small,.note,.help,.pull')&&m.children.length>2){ carry.push(m.lastElementChild); m.removeChild(m.lastElementChild); }
      while(isHead(m.lastElementChild)&&m.children.length>2){ carry.unshift(m.lastElementChild); m.removeChild(m.lastElementChild); }
      if(m.children.length>1) flush();
      carry.forEach(c=>m.appendChild(c)); m.appendChild(b);
      if(!fits()&&b.tagName==='P'&&!b.matches('.pull')){ m.removeChild(b); splitP(b); }
    }
    if(m.children.length>1||first) flush();
  });
  ml.remove(); document.body.classList.remove('measuring'); if(coverOn) document.body.classList.add('is-cover');
  return out;
}
