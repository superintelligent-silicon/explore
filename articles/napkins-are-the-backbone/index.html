<script>
(() => {
/* ---------------- content ---------------- */
const DOC_TITLE = "Napkins Are the Backbone";
const DOC_SUB = "Small business holds up America, we're told. Look closer at what it's actually holding up.";
const DATE_CHIP = "Oct 14, 2026";
const AUTHOR = "Superintelligent Silicon";
/* chapter hues, taken from a diner table: ketchup, mustard, teal booth, ballpoint receipt, kraft paper, cash, grape soda, neon sign */
const HUES = [[214, 58, 47], [222, 158, 28], [20, 150, 140], [52, 98, 200], [204, 112, 48], [58, 150, 78], [128, 82, 196], [214, 64, 140]];
const BLOCKS = [
  { t: "cover" },
  { t: "toc", items: [
    { icon: "napkin", title: "Prologue", desc: "Everything on the table came from somewhere big", id: "pro" },
    { icon: "r1", title: "The Backbone Speech", desc: "What leaders say, and what the numbers say", id: "c1", gap: true },
    { icon: "r2", title: "Follow the Napkin", desc: "The business is temporary, the order isn't", id: "c2" },
    { icon: "r3", title: "Picks and Shovels", desc: "The oldest trade in every rush", id: "c3" },
    { icon: "r4", title: "Single Use", desc: "Why the churn is the point", id: "c4" },
    { icon: "r5", title: "The New Gold Rush", desc: "Agents, tokens and the people who pay", id: "c5" },
    { icon: "r6", title: "Who Holds the Megaphone", desc: "Hype, incentives and an honest test", id: "c6" },
    { icon: "r7", title: "How Not to Be the Napkin", desc: "Six ways to stand on the other side", id: "c7" },
    { icon: "store", title: "Epilogue", desc: "The napkin in your hand", id: "epi", gap: true },
    { icon: "napkin", title: "The End", desc: "", id: "end", gap: true },
    { icon: "book", title: "TL;DR", desc: "The whole book in a minute", id: "tldr" },
    { icon: "pen", title: "Words worth knowing", desc: "A plain-English glossary", id: "words" },
    { icon: "link", title: "Sources", desc: "Where the facts come from", id: "src" }] },

  { t: "chapter", id: "pro", label: "Prologue", title: "The Napkin Test", sub: "Everything on the table came from somewhere big.", scene: "napkin", hue: 0, world: "spine" },
  { t: "p", s: "Next time you sit down at a new restaurant in town, pick up the napkin before the food comes. Everything else about the place is brand new: the owners, the menu, the paint, the hand-lettered sign out front, and the nervous energy of people who have bet their savings on this one room. The napkin isn't new at all. It's the same napkin you wiped your hands on at whatever used to be in this space, and probably the place before that. It came off a truck, which came from a warehouse, which bought it by the pallet from a mill that makes them by the billion and has never heard of the people who own this restaurant." },
  { t: "p", s: "Once you notice it, you see it everywhere. Storefronts change hands, places get sold, remodeled, renamed and relaunched, and a lot of the people who buy in find out it's harder and less profitable than they were promised. The stuff inside barely changes, though. The same paper cups, the same receipt rolls, the same cleaning supplies and the same bulk-packed everything show up behind counter after counter, ordered from the same handful of suppliers, no matter whose name is on the lease this year." },
  { t: "p", s: "Politicians love to tell us that small businesses are the backbone of America. It's one of the few lines both parties agree on, it always gets applause, and most of us nod along. Look at it long enough, though, and it starts to sound like mostly bullshit, or at least true in a way that nobody saying it means out loud." },
  { t: "h", s: "What is the backbone holding up?" },
  { t: "p", s: "Here's the idea this book is built around. Small businesses really are a backbone, just not quite of the thing we're told. They're the backbone of a much bigger network: the companies that take raw materials and turn them into napkins, cups, plates, name badges, card readers, ad impressions and software subscriptions, and that need millions of storefronts to move all of it to the final customer and, eventually, into the trash. Those big players are brilliant at making things in bulk and bad at selling them one at a time, so small businesses do that last mile for them, and the arrangement keeps working whether any particular small business survives or not." },
  { t: "p", s: "That sounds cynical, and part of it is. But it's also the clearest way to understand what's happening right now with AI, where the same pattern is playing out faster and louder than it ever did with napkins. So this book starts in a diner and ends with AI agents, and it tries to be fair along the way, including to the parts of the argument that are least certain." },
  { t: "recap", items: ["The napkin in a brand-new restaurant isn't new. It came from a mill that has never heard of the owners and will keep selling napkins to whoever takes the space next.", "Small businesses may well be a backbone, but of the big network that makes and moves mass-produced goods, not necessarily of their owners' prosperity."] },

  { t: "chapter", id: "c1", label: "Chapter One", title: "The Backbone Speech", sub: "What leaders say, and what the numbers say.", scene: "churn", hue: 3, world: "columns" },
  { t: "p", s: "The line is genuinely bipartisan. A 2014 statement from the Obama White House called America's small businesses the backbone of the economy. In May 2026, at a White House event for National Small Business Week, President Trump called them the lifeblood of the American economy and the most important economic force in the country. Swap the presidents and the speeches would barely change." },
  { t: "p", s: "The official numbers do make small business sound enormous. The SBA's Office of Advocacy counts about 36.2 million small businesses in the United States, which is 99.9 percent of all businesses. They employ 62.3 million people, roughly 46 percent of private-sector workers, and account for about 43.5 percent of GDP." },
  { t: "h", s: "Where the numbers get quieter" },
  { t: "p", s: "Those totals hide what being one of those 36 million businesses usually looks like. Most of them have no employees at all. The Census Bureau counted about 29.8 million nonemployer businesses in 2022, meaning one-person operations like freelancers, side hustles, single-property landlords and independent tradespeople, and together they brought in about $1.7 trillion, a little under 7 percent of the economy. When a politician says 36 million small businesses, roughly four out of five of them are one person and a bank account." },
  { t: "illo", k: "survival" },
  { t: "p", s: "Then there's how long they last. The Bureau of Labor Statistics followed every business establishment that opened in 2013. A year later, 79.6 percent were still operating. After five years it was 50.6 percent, and after ten years only 34.7 percent were left, so two out of every three were gone within a decade." },
  { t: "p", s: "Staying open isn't the same as doing well, either. In the Federal Reserve's 2025 Small Business Credit Survey, which covers firms with employees and isn't a random sample, only 47 percent said they were operating at a profit, 94 percent had faced financial challenges in the past year, and more than half of those had dipped into the owner's personal money to get through them. An older JPMorgan Chase Institute study of nearly 600,000 small businesses found that the typical one held only enough cash to cover 27 days of expenses if money stopped coming in, and a quarter of them held less than 13." },
  { t: "h", s: "Where the folklore gets it wrong" },
  { t: "p", s: "You'll often hear that something like 80 percent of small businesses fail. The real picture is less dramatic and, honestly, more interesting. About half make it five years and a third make it ten, and plenty of closures aren't failures in the bankrupt sense, because owners retire, sell, move or simply decide they've had enough. What the data supports is a softer version of the folklore that's still uncomfortable: most small businesses are very small, many don't last, and a large share of the ones that do are scraping by rather than building wealth." },
  { t: "pq", s: "\"Four out of five small businesses are one person and a bank account.\"" },
  { t: "recap", items: ["Leaders of both parties call small business the backbone of the country, and by headcount it's enormous: 36 million firms and almost half of private jobs.", "But about 80 percent are one-person operations, two-thirds of new establishments are gone within ten years, and fewer than half of employer firms report a profit.", "The 80 percent failure rate you hear about is an exaggeration. The scraping-by part isn't."] },

  { t: "chapter", id: "c2", label: "Chapter Two", title: "Follow the Napkin", sub: "The business is temporary. The order isn't.", scene: "chain", hue: 4, world: "funnel" },
  { t: "p", s: "Try following a single napkin backward. It started as pulp at a paper mill, got converted, folded and packed into cases, sold by the pallet to a broadline distributor, loaded onto a truck with hundreds of other products, dropped at a restaurant's back door, used once, and thrown away. Every link in that chain except one is a large, specialized operation that lives on volume. The one exception is the restaurant." },
  { t: "p", s: "Look at who sits in the middle. Sysco, the biggest foodservice distributor in the country, reported $81.4 billion in sales for its 2025 fiscal year and says it serves about 730,000 customer locations. The U.S. market for foodservice disposables alone, meaning cups, lids, clamshells, napkins, cutlery and the rest, was worth about $28.2 billion in 2025, and the Freedonia Group expects it to reach $33.3 billion by 2030. Those are steady, compounding businesses built on top of a customer base that is anything but steady." },
  { t: "h", s: "Churn is good for the supplier" },
  { t: "p", s: "Restaurants are the classic example of that unsteadiness, even though the famous claim that 90 percent fail in their first year is a myth. When Ohio State's H.G. Parsa tracked more than 2,400 restaurants in Columbus in the late 1990s, about 26 percent closed in their first year and 59 percent within three years, with independent restaurants doing slightly worse than chains, at 61 percent against 57." },
  { t: "p", s: "Here's the part that's easy to miss. For the companies supplying them, one restaurant closing and another opening in the same space isn't really a loss, and it's often a gain. The new owner orders a fresh set of everything: new signage, new menus, new uniforms, new plates to match the new concept, a new point-of-sale system, a full opening inventory, and a round of advertising to announce it all. The supplier loses one small account and gains another, and the startup order is usually bigger than the steady one it replaced. The storefront stays the same, and the only thing that changes is the person carrying the risk." },
  { t: "p", s: "The same thing happens anywhere ownership turns over. When a salon, a gym or a corner shop changes hands, the new owner buys new chairs, new equipment and new signage, and a whole set of vendors gets a burst of work out of the change. None of those vendors needs any particular owner to succeed for that work to keep coming." },
  { t: "h", s: "Who gets paid when a small business tries" },
  { t: "ledger", heads: ["Gets paid", "If the business closes"], rows: [
    { icon: "factory", a: "The mill and the factory", b: "On every case, from every shop, whether the shop lasts or not", c: "Loses one small customer out of hundreds of thousands" },
    { icon: "truck", a: "The distributor", b: "Weekly, on delivery, usually on short terms", c: "The truck stops at the next door down the street" },
    { icon: "key", a: "The landlord", b: "Every month, often backed by the owner's personal guarantee", c: "Relets the space to the next hopeful, sometimes with a fresh deposit" },
    { icon: "globe", a: "The platforms", b: "A cut of every card swipe, every online order and every ad", c: "Loses a subscription and signs up the next one" },
    { icon: "person", a: "The owner", b: "Last, after everyone above", c: "Keeps the debt, the lease and the loss" }] },
  { t: "recap", items: ["A napkin passes through a chain of huge, steady companies, and the only small, fragile link is the business that hands it to you.", "When a small business closes and another opens in its place, suppliers usually come out ahead, because a startup order is bigger than a steady one.", "In the chain of who gets paid, the owner is paid last and carries the loss."] },

  { t: "chapter", id: "c3", label: "Chapter Three", title: "Picks and Shovels", sub: "The oldest trade in every rush.", scene: "goldpan", hue: 1, world: "spiral" },
  { t: "p", s: "None of this is new. The best-known version of the pattern is the California Gold Rush. In 1848, Sam Brannan owned the only store between San Francisco and the gold fields. He bought up all the picks, shovels and pans he could get, then ran through the streets of San Francisco shouting that there was gold in the river. By one account he paid twenty cents for pans and sold them for fifteen dollars apiece, and his store was said to take in thousands of dollars a day. He's often called California's first millionaire, and he didn't need to find much gold to get there." },
  { t: "p", s: "Most of the miners, meanwhile, didn't get rich. Conditions were far harsher than people expected; some died, some went home broke, and a few struck it rich. Even the majority who turned some profit mostly made modest money rather than a fortune. Levi Strauss, on the other hand, built a company that's still around by selling tough work pants to the people doing the digging." },
  { t: "p", s: "Brannan's story has a coda worth keeping in mind. He lost nearly everything later in life to drinking, fights and bad investments, and died in 1889 with almost nothing to leave his children. Even the shovel seller isn't safe if he's small and the rush moves on. The ones who do best over the long run are the ones who sell to every rush, rather than riding a single one." },
  { t: "h", s: "Modern shovels" },
  { t: "p", s: "Today's shovels are mostly digital. Shopify, which sells online storefronts and the tools behind them, brought in $11.55 billion in revenue in 2025, and $8.8 billion of that came from merchant solutions, mostly its cut of payments, on $378 billion worth of goods sold through its platform. Meta told investors in April 2026 that more than 8 million advertisers were using at least one of its AI ad tools, with especially strong uptake among small and medium businesses. Both companies earn from the attempt rather than the outcome, because every store opened is a subscription and every ad bought is revenue, whether or not the store ever turns a profit." },
  { t: "p", s: "Even the language gets borrowed. In 2013 Etsy published a report describing its sellers as entrepreneurs embracing self-reliance, and noted that 65 percent of sellers who had made less than $100 the year before still considered their shop a business. Slate's Amanda Hess pointed out that calling it entrepreneurship didn't change how little most of it paid. Etsy probably wasn't lying. It was describing its users in the most flattering terms available, which is exactly what the backbone speech does too." },
  { t: "pq", s: "\"The steady money in a rush sits with whoever sells to everyone who tries.\"" },
  { t: "recap", items: ["In the Gold Rush, the merchant who sold pans got rich while most miners made little, and even he lost it all when the rush moved on.", "Today Shopify, Meta and the rest earn from every store opened and every ad bought, whether the business works or not.", "Flattering language about entrepreneurship is part of the product."] },

  { t: "chapter", id: "c4", label: "Chapter Four", title: "Single Use", sub: "Why the churn is the point, and where the argument stops.", scene: "turnover", hue: 0, world: "lattice" },
  { t: "p", s: "Here's the dark part, said plainly, before arguing with it. The cynical reading goes like this. The people with real economic power, the big producers and the politicians who depend on their support, don't care much about any individual small business owner. What they need is a steady supply of people trying, because each attempt buys inventory, signs a lease, opens a merchant account and pays for ads, and if most of them fail, a new crop is always ready to replace them. In that reading, small business owners are a lot like the napkins they buy: useful, interchangeable and single use." },
  { t: "h", s: "Economists agree, in politer words" },
  { t: "p", s: "The surprising part is that mainstream economics mostly agrees with the mechanics and just uses kinder language. A well-known study by John Haltiwanger, Ron Jarmin and Javier Miranda found that what predicts job creation isn't a company's size but its age, and that young firms create the most jobs. They also described an up-or-out pattern, where many young firms fail within about five years and those failures wipe out nearly half the jobs that new companies created. The survivors grow fast enough to make the whole churn worth it for the economy as a whole." },
  { t: "illo", k: "storefront" },
  { t: "p", s: "Economists call that dynamism, and they mean it as a good thing. From the economy's point of view it is, because a society where lots of people try things finds the winners faster than one where nobody does. The catch is that the economy and the individual owner are keeping different books. The economy collects the winners, and the owner keeps the losses." },
  { t: "h", s: "Where the argument stops" },
  { t: "p", s: "There's probably no room somewhere where people planned this, because nobody has to. Every supplier is happy to sell to whoever walks in, every platform is happy to sign up whoever clicks, and every politician is happy to praise a group that's tens of millions of voters strong. The result looks coordinated because the incentives all point the same way, not because anyone is steering. That matters, because it changes what you can do about it. You can't expose a conspiracy that doesn't exist, but you can learn to read the incentives." },
  { t: "p", s: "It also stops short of calling the owners fools. The rough phrase that comes to mind is useful idiots, and that isn't fair to the people, even if it's a fair description of how the system treats them. Plenty of owners know the odds and go anyway, because they value owning their own time or because the experience is worth more to them than the income, and a failed business can teach more than years in a steady job. The problem isn't trying. The problem is trying while being told a story that hides who's guaranteed to get paid." },
  { t: "recap", items: ["The system needs a constant supply of people trying, because every attempt buys something, and that works even when most attempts fail.", "Economists agree on the mechanics: young firms create jobs, many fail, and the survivors carry the economy. The economy keeps the winners; the owner keeps the losses.", "No conspiracy is needed, just incentives that all point the same way. Knowing that is what lets you work around them."] },

  { t: "chapter", id: "c5", label: "Chapter Five", title: "The New Gold Rush", sub: "Agents, tokens, and the people who pay to find out.", scene: "tokens", hue: 6, world: "globe" },
  { t: "p", s: "All of that would just be an interesting observation about napkins if the same pattern weren't playing out right now, at a speed the napkin business could never dream of. The new rush is AI, and in particular the promise that you can tell an AI agent you want a business and it will build and run one for you." },
  { t: "p", s: "A good example is a recent post from Alex Finn, one of the more popular AI influencers on X, about using agents to make money online more or less on autopilot. He's been making claims along these lines for a while. A widely shared 2025 write-up credited him with over $300,000 in annualized revenue within two weeks of launching a web app built with AI, and on a podcast this spring he talked about a $200 AI subscription being enough to start a niche software company that could be worth millions almost overnight." },
  { t: "p", s: "None of this means he's lying. He almost certainly built things, and money almost certainly came in. What's harder to believe is that the agent is the reason the money came in. Read his posts closely and a lot of his buyers look like they're buying him: his audience, his credibility, and the fact that a huge number of people already pay attention to what he says. If the same agent had built the same product in silence, under a name nobody knew, it's hard to imagine the results looking anything like what he describes. The hardest part of any small business has always been getting customers, and an audience is a customer list you already own." },
  { t: "p", s: "His agentusecases.ai project shows the pattern in miniature. By his own account, an agent built a directory of AI use cases, added a newsletter, and sold a sponsorship slot through a payment link, with the price going up after each sale. The mechanics are real and worth learning from. But look at what the site actually is: mostly use cases gathered from other people's posts around the web, each one a line or two deep. The traffic that made it work came from his announcement to a following most people will never have, and the sponsor was buying a spot in front of that following. The agent built a website. The audience made the money." },
  { t: "pq", s: "\"An audience is a customer list you already own.\"" },
  { t: "h", s: "Tokens are the new napkins" },
  { t: "p", s: "Now look at who gets paid in this rush. Every prompt, every agent run, every failed attempt and every retry burns tokens, the small units AI companies use to meter and bill their models, and the bill arrives whether the business works or not. Anthropic, the company behind the Claude models, reportedly reached a revenue run rate of more than $65 billion by the end of July 2026, up more than sevenfold from the end of the year before. Lovable, a tool that lets people build apps by describing them, said it hit $300 million in annual recurring revenue in February 2026, triple what it had the previous summer." },
  { t: "illo", k: "launches" },
  { t: "p", s: "Meanwhile the number of people trying has exploded. RevenueCat, which runs subscription billing for tens of thousands of apps, reported that new subscription app launches went from about 2,000 a month in 2022 to nearly 15,000 a month by early 2026, as AI made building faster and cheaper. Apps launched in 2025 or later account for just 3 percent of all subscription revenue, though, and the company's previous report found that most new apps never reach even $1,000 a month in their first two years, while the top 5 percent earn over 400 times what the bottom quarter does." },
  { t: "p", s: "Bigger companies aren't doing much better at turning AI into profit. A 2025 MIT report, based on interviews, surveys and a review of 300 public deployments, found that about 95 percent of corporate generative AI pilots stalled before delivering measurable financial returns. People have argued about its methods, but it matches what plenty of people working with these tools report." },
  { t: "p", s: "So the shape is the same as the napkin chain, only faster. The model makers take raw material, in this case computing power and a huge share of the world's writing, and turn it into something sold by the token. The tool makers wrap it into products. And a vast, fast-churning crowd of small builders does the expensive work of trying every possible use, paying for the privilege, and finding out the hard way which ones don't work. The big companies get paid for every attempt and get to watch which attempts succeed. In a real sense, the small builders are doing product research the big companies can't do on their own, and paying them for the chance to do it." },
  { t: "h", s: "The AI version of the chain" },
  { t: "ledger", heads: ["Gets paid", "If the project fails"], rows: [
    { icon: "chip", a: "Chip and data-center companies", b: "Up front, on every model trained and every query served", c: "Already paid" },
    { icon: "gear", a: "The model companies", b: "By the token, on every attempt, working or not", c: "Keep the revenue and learn from how people used it" },
    { icon: "box", a: "The app-building tools", b: "Monthly subscriptions plus usage", c: "Lose one subscriber and sign up the next" },
    { icon: "mega", a: "The hype accounts", b: "Attention, followers, sponsorships, courses", c: "Post the next experiment" },
    { icon: "person", a: "The builder", b: "Only if customers show up", c: "Keeps the bills and the lesson" }] },
  { t: "recap", items: ["The pitch is that an agent can build and run a business for you. The examples usually lean on the creator's own audience, which the agent didn't build.", "Tokens are the new napkins: every attempt is billed whether it works or not, and the companies selling them are growing at an extraordinary pace.", "App launches have soared while most new apps barely earn, so the crowd of small builders is paying to do the big companies' product research."] },

  { t: "chapter", id: "c6", label: "Chapter Six", title: "Who Holds the Megaphone", sub: "Hype, incentives, and an honest test.", scene: "megaphone", hue: 7, world: "wave" },
  { t: "p", s: "It's fair to ask whether people like Finn are being paid to hype these tools. Nobody outside those arrangements knows the details, and it would be wrong to pretend otherwise. But you don't need a secret check for the incentives to line up. In this industry, early access to new models, free credits, invitations to launch events and a front-row seat for every announcement are all things a large audience can earn, and the bigger the excitement, the bigger the audience gets." },
  { t: "p", s: "The law treats some of that as meaningful. The FTC's updated Endorsement Guides, issued in June 2023, say that free or discounted products and perks like early access count as material connections, and when a connection like that could affect how much weight people give an endorsement, it has to be disclosed clearly, right alongside the endorsement rather than buried in a profile. A creator who got nothing and simply loves a tool is free to say so. A creator who got credits or early access has to tell you." },
  { t: "p", s: "Disclosure only covers part of it, though. The bigger incentive is built into the business. Excitement about AI making you money is the best possible fuel for an AI audience, newsletter, course or paid community, so the people telling the most exciting stories are often selling a second shovel, and the tool companies win either way, because every person inspired to try becomes a paying customer." },
  { t: "p", s: "None of that means the tools are useless. They're genuinely useful, and they've changed what one person can build. It means the gap between what an agent can do and what an agent can do *without its owner's name and audience behind it* is exactly the gap the hype tends to skip over." },
  { t: "p", s: "The honest version of the dream is still worth chasing: agents that help anyone doing legitimate work earn a living, whether that's a handyman quoting jobs faster or a one-person shop answering customers at midnight. That version usually starts by selling a real service to demand that already exists nearby, and builds an audience slowly, if at all. What isn't honest is the \"anyone can do this on autopilot\" story, because it skips the part that made the example work. And whether a given attempt succeeds or not, the tool sellers and platforms get paid for it, the same way the napkin supplier gets paid whether the diner makes it or not." },
  { t: "h", s: "The napkin test for money-making posts" },
  { t: "p", s: "Here's a checklist worth running whenever someone says their AI built them a business. Tap a box to tick it off; your ticks stay on this device." },
  { t: "task", id: "t1", s: "**Where did the customers come from?** If the answer is the creator's existing audience, the agent didn't find them." },
  { t: "task", id: "t2", s: "**Would it sell if nobody knew who built it?** Picture the same product launched by an anonymous account with no followers." },
  { t: "task", id: "t3", s: "**What did it cost to run?** Count the subscriptions, the tokens, the hosting and the hours of human babysitting, not just the revenue." },
  { t: "task", id: "t4", s: "**Is the money recurring or a launch spike?** Two good weeks after a viral post aren't the same as a year of customers." },
  { t: "task", id: "t5", s: "**What's being sold to you right now?** A course, a template pack, a paid community or a newsletter is a second business riding on the first story." },
  { t: "task", id: "t6", s: "**Is there a disclosed relationship?** Look for mentions of credits, early access or partnerships with the tool maker." },
  { t: "task", id: "t7", s: "**Is it still running a year later?** Most of these stories never get a follow-up." },
  { t: "recap", items: ["You don't need a secret payment for the incentives to line up: excitement grows the audience, and the audience is the business.", "The FTC requires creators to disclose free products, credits and early access when they endorse something.", "Before believing an agent made someone money, ask where the customers came from and whether it would have sold in silence."] },

  { t: "chapter", id: "c7", label: "Chapter Seven", title: "How Not to Be the Napkin", sub: "Six ways to stand on the other side of the counter.", scene: "shovel", hue: 5, world: "trio" },
  { t: "p", s: "If the system runs on people trying, the answer isn't to stop trying. It's to try with your eyes open, and wherever you can, to stand on the supplier's side of the counter." },
  { t: "li", icon: "n1", s: "**Sell to the churn instead of riding it.** The steadiest small businesses tend to serve other businesses that come and go: bookkeepers, cleaners, inspectors, repair techs and sign makers. None of them needs any single client to survive, and every closing and reopening is new work for them rather than a loss." },

  { t: "p", s: "None of this is a case against small business, or against the people who run one, who are some of the most capable and stubborn people in any town. It's a case against the speech, the comfortable story that tells millions of people they're the backbone of the country while the money from their attempts flows steadily uphill to whoever makes the napkins." },
  { t: "p", s: "The honest version of the line would go something like this: small businesses are the backbone of the supply network, and the supply network is doing fine. Nobody's going to put that on a banner, but it's a lot more useful to know, because once you can see which body the backbone is holding up, you can decide for yourself whether you want to be one of the vertebrae or the thing they support." },
